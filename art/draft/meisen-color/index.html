<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>銘仙の差し色と書体の検証｜CAC 2027</title>
<link rel="icon" type="image/svg+xml" href="../../favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#fff}
iframe{display:block;width:100%;height:100%;border:0}
.panel{position:fixed;right:14px;bottom:14px;z-index:10;width:304px;max-height:calc(100% - 28px);overflow:auto;background:#fff;
  border:1px solid #d6d4cc;box-shadow:0 12px 30px #00000024;font:400 12.5px/1.6 'Zen Kaku Gothic New',sans-serif;color:#262523}
.panel summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;padding:11px 14px;font-weight:500;letter-spacing:.05em}
.panel summary::after{content:'−'}
.panel:not([open]) summary::after{content:'＋'}
.inner{padding:2px 14px 14px}
.grp{margin:0 0 12px}
.grp>b{display:block;font-weight:400;font-size:11px;letter-spacing:.1em;color:#77756e;margin-bottom:5px}
.opts{display:flex;flex-wrap:wrap;gap:5px}
.opts button{font:inherit;font-size:12px;border:1px solid #d6d4cc;background:#fff;color:#262523;padding:5px 9px;cursor:pointer}
.opts button[aria-pressed="true"]{background:#262523;color:#fff;border-color:#262523}
.now{margin:0 0 12px;padding:9px 10px;background:#f4f3ef;font-size:12px;line-height:1.7}
.now i{display:inline-block;width:11px;height:11px;margin-right:6px;vertical-align:-1px;transition:background .6s}
.loom{display:flex;height:8px;margin-top:6px}
.loom span{flex:1}
.draftnote{position:fixed;left:50%;top:8px;transform:translateX(-50%);z-index:10;font:400 11px/1 'Zen Kaku Gothic New',sans-serif;
  background:#fff;border:1px solid #d6d4cc;color:#77756e;padding:6px 11px;white-space:nowrap;pointer-events:none}
@media (max-width:700px){.panel{left:8px;right:8px;width:auto;bottom:8px;max-height:46%}.draftnote{font-size:10px}}
</style>
</head>
<body>
<div class="draftnote">検証用：いまのサイトに差し色と書体を重ねています（本番は未反映）</div>
<iframe id="site" src="../../index.html" title="ちちぶアートクリエーション2027 のサイト（検証表示）"></iframe>

<details class="panel" open>
<summary>差し色と書体を切り替える</summary>
<div class="inner">
<p class="now" id="now"></p>
<div class="grp"><b>色の決め方</b>
<div class="opts" data-g="mode">
<button data-v="weft">緯糸で変わる</button><button data-v="kon">紺で固定</button>
</div></div>
<div class="grp"><b>差し色の量</b>
<div class="opts" data-g="amount">
<button data-v="strong">しっかり</button><button data-v="soft">控えめ</button><button data-v="off">なし（いま）</button>
</div></div>
<div class="grp"><b>白い地にも緯糸の色を乗せる</b>
<div class="opts" data-g="ground">
<button data-v="on">乗せる</button><button data-v="off">乗せない</button>
</div></div>
<div class="grp"><b>書体</b>
<div class="opts" data-g="font">
<button data-v="new">しっぽり明朝＋Zen角ゴシック</button><button data-v="now">いまのまま</button>
</div></div>
<div class="grp"><b>ページ</b>
<div class="opts" data-g="page">
<button data-v="../../index.html">トップ</button><button data-v="../../team/index.html">わたしたち</button><button data-v="../../open-call/index.html">反物公募</button>
</div></div>
</div>
</details>

<script>
(function(){
  /* 色はすべて逸見織物さんの秩父銘仙（反物・糸）の写真から */
  var C={kon:'#2e3452',shu:'#b65a38',koubai:'#b0667a',beni:'#9a2d29',uguisu:'#7f7a3a'};
  var NAME={kon:'紺（反物の地色）',shu:'朱（紺地の薔薇）',koubai:'紅梅（棚の反物）',beni:'紅（染めた緯糸）',uguisu:'鶯（薔薇の葉）'};
  /* セクションごとに通す緯糸。最初の画面は紺（キービジュアルはそのまま） */
  var WEFT={home:'kon','open-call':'shu',about:'koubai',program:'beni',people:'uguisu',journey:'shu',news:'koubai',together:'beni',partners:'kon'};
  var state={mode:'weft',amount:'strong',ground:'on',font:'new',page:'../../index.html'};
  var frame=document.getElementById('site'), current='kon';

  function css(){
    var o='';
    if(state.font==='new'){
      o+=":root{--serif:'Shippori Mincho','Yu Mincho','Hiragino Mincho ProN',serif}"+
         "body{font-family:'Zen Kaku Gothic New','Yu Gothic',sans-serif;font-weight:500;line-height:2}";
    }
    if(state.amount==='off')return o;
    var weft=state.mode==='weft'?'var(--weft)':'var(--kon)';
    o+="@property --weft{syntax:'<color>';inherits:true;initial-value:"+C.kon+"}"+
       ":root{--kon:"+C.kon+";--weft:"+C.kon+";--ai:var(--kon);transition:--weft 1.1s ease;"+
       "--tamamushi:linear-gradient(90deg,var(--kon),"+weft+")}"+
       /* 経糸（変わらない）：見出しラベル・日付・ボタンは紺 */
       ".eyebrow,.section-label,.program-en,.mrole,.deadline strong{color:var(--kon)}"+
       ".date{color:var(--kon)}"+
       /* 緯糸（セクションで変わる） */
       ".timeline li:before{background:"+weft+"}"+
       "::selection{background:color-mix(in srgb,"+weft+" 28%,transparent)}";
    if(state.amount==='strong'){
      o+=".vertical-note{background:#fff;color:"+weft+";padding:16px 10px;letter-spacing:.24em;transition:color .6s}"+
         ".call-grid em,.about-copy h2 em{color:"+weft+"}"+
         ".together-links>a,.program-grid article{border-top:2px solid "+weft+"}"+
         ".call-panel{border-top:2px solid "+weft+"}"+
         ".dark{background:var(--kon)}a.dark:hover,.dark:hover{background:"+weft+"}"+
         ".call-word{color:color-mix(in srgb,"+weft+" 30%,transparent)}"+
         ".large-word{color:color-mix(in srgb,"+weft+" 20%,transparent)}"+
         ".section-label>span:first-child,.section-label:not(:has(span)){border-left:3px solid "+weft+";padding-left:10px}";
    }
    if(state.mode==='weft'){
      /* 左端の進捗バー＝織り上がった布。通った緯糸の色が縞で積み重なる */
      o+=".progressbar{width:4px}.progressbar i{background:var(--loom) no-repeat;background-size:100% 100vh}";
      if(state.ground==='on'){
        /* 白く残した部分に緯糸の色が出る：白だけに色を乗せ、墨色の部分はそのまま（乗算） */
        o+="#weft-ground{position:fixed;inset:0;pointer-events:none;z-index:40;mix-blend-mode:multiply;"+
           "background:var(--weft);opacity:var(--ground-op,0);transition:opacity 1.1s ease}";
      }
    }
    return o;
  }

  function script(d){
    if(d.getElementById('weft-script'))return;
    var g=d.createElement('div');g.id='weft-ground';d.body.appendChild(g);
    var s=d.createElement('script');s.id='weft-script';
    s.textContent='('+function(C,WEFT){
      var root=document.documentElement,secs=[].slice.call(document.querySelectorAll('main section[id],section.partners-section'));
      function loom(){ /* 各セクションの位置を、進捗バーの縞の位置に写す */
        var H=document.documentElement.scrollHeight,stops=[];
        secs.forEach(function(s){var id=s.id||'partners',a=s.offsetTop/H*100,b=(s.offsetTop+s.offsetHeight)/H*100,c=C[WEFT[id]||'kon'];
          stops.push(c+' '+a.toFixed(2)+'%',c+' '+b.toFixed(2)+'%');});
        root.style.setProperty('--loom','linear-gradient(180deg,'+stops.join(',')+')');
      }
      var last='';
      function pick(){ /* 画面の中央にかかっているセクションの緯糸を通す */
        var y=innerHeight/2,id='home';
        secs.forEach(function(s){var r=s.getBoundingClientRect();if(r.top<=y&&r.bottom>y)id=s.id||'partners';});
        if(id===last)return;last=id;
        var k=WEFT[id]||'kon';root.style.setProperty('--weft',C[k]);
        root.style.setProperty('--ground-op',id==='home'?0:(matchMedia('(max-width:700px)').matches?.075:.06));
        window.parent.postMessage({weft:k},'*');
      }
      addEventListener('scroll',pick,{passive:true});addEventListener('resize',function(){loom();pick();});
      addEventListener('load',loom);loom();pick();setTimeout(loom,1500);
    }.toString()+')('+JSON.stringify(C)+','+JSON.stringify(WEFT)+')';
    d.body.appendChild(s);
  }

  function inject(){
    var d=frame.contentDocument;if(!d||!d.head)return;
    if(!d.getElementById('probe-fonts')){
      var l=d.createElement('link');l.id='probe-fonts';l.rel='stylesheet';
      l.href='https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500&family=Zen+Kaku+Gothic+New:wght@400;500&display=swap';
      d.head.appendChild(l);
    }
    var st=d.getElementById('probe-style');
    if(!st){st=d.createElement('style');st.id='probe-style';d.head.appendChild(st);}
    st.textContent=css();
    if(state.mode==='weft'&&state.amount!=='off')script(d);
  }
  function showNow(){
    var n=document.getElementById('now');
    if(state.mode!=='weft'||state.amount==='off'){n.innerHTML='<i style="background:'+C.kon+'"></i>紺で統一しています';return;}
    var order=['kon','shu','koubai','beni','uguisu','shu','koubai','beni','kon'];
    n.innerHTML='<i style="background:'+C[current]+'"></i>いま通っている緯糸：'+NAME[current]+
      '<span class="loom">'+order.map(function(k){return '<span style="background:'+C[k]+'" title="'+NAME[k]+'"></span>';}).join('')+'</span>';
  }
  function mark(){
    Object.keys(state).forEach(function(g){
      document.querySelectorAll('[data-g="'+g+'"] button').forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset.v===state[g]));});
    });
    showNow();
  }
  addEventListener('message',function(e){if(e.data&&e.data.weft){current=e.data.weft;showNow();}});
  document.querySelectorAll('.opts').forEach(function(o){
    o.addEventListener('click',function(e){
      var b=e.target.closest('button');if(!b)return;
      var g=o.dataset.g;state[g]=b.dataset.v;mark();
      /* 緯糸のスクリプトは一度入れると残るため、決め方を変えたら読み直す */
      if(g==='page'||g==='mode'||g==='amount'){frame.src=state.page;}else inject();
    });
  });
  frame.addEventListener('load',function(){current='kon';inject();showNow();});
  mark();inject();
})();
</script>
</body>
</html>
