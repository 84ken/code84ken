<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>写真の形の検証｜CAC 2027</title>
<link rel="icon" type="image/svg+xml" href="../../favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#fff}
iframe{display:block;width:100%;height:100%;border:0}
.panel{position:fixed;right:14px;bottom:14px;z-index:10;width:300px;background:#fff;border:1px solid #d6d4cc;
  box-shadow:0 12px 30px #00000024;font:400 12.5px/1.6 'Zen Kaku Gothic New',sans-serif;color:#262523}
.panel summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;padding:11px 14px;font-weight:500}
.panel summary::after{content:'−'}
.panel:not([open]) summary::after{content:'＋'}
.inner{padding:2px 14px 14px}
.grp{margin:0 0 12px}
.grp>b{display:block;font-weight:400;font-size:11px;letter-spacing:.1em;color:#77756e;margin-bottom:5px}
.opts{display:flex;flex-wrap:wrap;gap:5px}
.opts button{font:inherit;font-size:12px;border:1px solid #d6d4cc;background:#fff;color:#262523;padding:5px 9px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.opts button[aria-pressed="true"]{background:#262523;color:#fff;border-color:#262523}
.opts svg{width:12px;height:15px;fill:currentColor}
.note{margin:0;font-size:11.5px;color:#55534d;background:#f4f3ef;padding:7px 9px}
.draftnote{position:fixed;left:50%;top:8px;transform:translateX(-50%);z-index:10;font:400 11px/1 'Zen Kaku Gothic New',sans-serif;
  background:#fff;border:1px solid #d6d4cc;color:#77756e;padding:6px 11px;white-space:nowrap;pointer-events:none}
@media (max-width:700px){.panel{left:8px;right:8px;width:auto;bottom:8px}.draftnote{font-size:10px}}
</style>
</head>
<body>
<div class="draftnote">検証用：いまのサイトの写真の形だけを差し替えています（本番は未反映）</div>
<iframe id="site" src="../../index.html#people" title="ちちぶアートクリエーション2027 のサイト（検証表示）"></iframe>

<details class="panel" open>
<summary>写真の形を切り替える</summary>
<div class="inner">
<div class="grp"><b>形</b>
<div class="opts" data-g="shape">
<button data-v="mayu"><svg viewBox="0 0 1 1.25"><path d="M.5 0C.82 0 .97 .2 .95 .37C.93 .52 .86 .57 .87 .625C.88 .68 .97 .75 .96 .9C.95 1.1 .8 1.25 .5 1.25C.2 1.25 .05 1.1 .04 .9C.03 .75 .12 .68 .13 .625C.14 .57 .07 .52 .05 .37C.03 .2 .18 0 .5 0Z"/></svg>繭形</button>
<button data-v="ellipse"><svg viewBox="0 0 1 1.25"><ellipse cx=".5" cy=".625" rx=".5" ry=".625"/></svg>楕円</button>
<button data-v="arch"><svg viewBox="0 0 1 1.25"><path d="M0 .5A.5 .5 0 0 1 1 .5V1.25H0Z"/></svg>アーチ</button>
<button data-v="round"><svg viewBox="0 0 1 1.25"><rect width="1" height="1.25" rx=".14"/></svg>角丸</button>
<button data-v="now"><svg viewBox="0 0 1 1.25"><rect width="1" height="1.25"/></svg>いま</button>
</div></div>
<div class="grp"><b>ページ</b>
<div class="opts" data-g="page">
<button data-v="../../index.html#people">トップ（審査員）</button><button data-v="../../team/index.html">わたしたち</button>
</div></div>
<p class="note" id="note"></p>
</div>
</details>

<script>
(function(){
  var NOTE={
    mayu:'繭形 ── 上下がふくらみ、真ん中がわずかにくびれた本物の繭の輪郭。テーマ「繭」をそのまま写真の枠にする案です。',
    ellipse:'楕円 ── すっきりした縦長の楕円。上品で、どの写真にもなじみます。',
    arch:'アーチ ── 上が半円。舞台の額縁や窓のような形で、公演の芸術祭らしさが出ます。',
    round:'角丸 ── 四角のまま角だけを丸める、いちばん控えめな変化です。',
    now:'いまの四角のままです。'
  };
  /* 繭の輪郭（写真の縦横に合わせて伸び縮みする座標） */
  var MAYU='M.5 0C.8 0 .98 .14 .98 .3C.98 .42 .93 .46 .935 .5C.94 .54 .99 .6 .99 .72C.99 .88 .8 1 .5 1C.2 1 .01 .88 .01 .72C.01 .6 .06 .54 .065 .5C.07 .46 .02 .42 .02 .3C.02 .14 .2 0 .5 0Z';
  var state={shape:'mayu',page:'../../index.html#people'};
  var frame=document.getElementById('site');
  var T='.portrait,.mphoto,.mmodal-photo';

  function css(){
    if(state.shape==='now')return '';
    var base='.portrait:not(.portrait-pending),.mphoto:not(.mphoto-blank),.mmodal-photo:not(.mphoto-blank){background:none!important}'+T+'{border:0!important}';
    if(state.shape==='mayu')return base+T+'{clip-path:url(#cac-mayu)}';
    if(state.shape==='ellipse')return base+T+'{border-radius:50%;overflow:hidden}';
    if(state.shape==='arch')return base+T+'{border-radius:50% 50% 0 0/40% 40% 0 0;overflow:hidden}';
    if(state.shape==='round')return base+T+'{border-radius:14px;overflow:hidden}';
  }
  function inject(){
    var d=frame.contentDocument;if(!d||!d.body)return;
    if(!d.getElementById('cac-mayu')){
      var ns='http://www.w3.org/2000/svg',svg=d.createElementNS(ns,'svg');
      svg.setAttribute('width','0');svg.setAttribute('height','0');svg.style.position='absolute';
      svg.innerHTML='<defs><clipPath id="cac-mayu" clipPathUnits="objectBoundingBox"><path d="'+MAYU+'"/></clipPath></defs>';
      d.body.appendChild(svg);
    }
    var s=d.getElementById('probe-shape');
    if(!s){s=d.createElement('style');s.id='probe-shape';d.head.appendChild(s);}
    s.textContent=css();
  }
  function mark(){
    Object.keys(state).forEach(function(g){
      document.querySelectorAll('[data-g="'+g+'"] button').forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset.v===state[g]));});
    });
    document.getElementById('note').textContent=NOTE[state.shape];
  }
  document.querySelectorAll('.opts').forEach(function(o){
    o.addEventListener('click',function(e){
      var b=e.target.closest('button');if(!b)return;
      state[o.dataset.g]=b.dataset.v;mark();
      if(o.dataset.g==='page')frame.src=b.dataset.v;else inject();
    });
  });
  frame.addEventListener('load',inject);
  mark();inject();
})();
</script>
</body>
</html>
