<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<title>売上ダッシュボード — SCHEMA, Inc.</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        primary: {
          50:'#f0f5ff',100:'#dde8ff',200:'#c0d4ff',300:'#95b6ff',
          400:'#6492ff',500:'#2b70ef',600:'#2250df',700:'#1a40b5',
          800:'#13318d',900:'#0e266a',950:'#07194e'
        }
      },
      fontFamily: {
        sans: ['Inter','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','sans-serif']
      }
    }
  }
}
</script>
<style>
:root { color-scheme: light; }
.text-body { color: #3d4b5f; }
body { font-size: 14px; line-height: 1.7; }
.bar-fill { transition: width 0.8s ease; }
.sparkbar { display: inline-block; height: 20px; border-radius: 2px; min-width: 2px; }
</style>
</head>
<body class="bg-gray-50 min-h-screen">

<!-- HQ Nav -->
<div style="position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid #e2e8f0;padding:8px 12px;flex-wrap:wrap;gap:8px;display:flex;align-items:center;gap:12px;">
  <a href="../index.html" style="display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:#2b70ef;font-size:13px;font-weight:600;">
    <img src="../logo_SCHEMA.jpg" alt="SCHEMA" style="width:24px;height:24px;border-radius:4px;object-fit:cover;">
    HQ
  </a>
  <span style="color:#cbd5e1;">/</span>
  <span style="color:#334155;font-size:13px;font-weight:600;">売上</span>
  <a href="vendor-search.html" style="color:#64748b;font-size:13px;text-decoration:none;">外注先</a>
  <a href="vendor-memo.html" style="color:#64748b;font-size:13px;text-decoration:none;">プロジェクト</a>
  <a href="cashflow.html" style="color:#64748b;font-size:13px;text-decoration:none;">キャッシュフロー</a>
  <span style="color:#cbd5e1;margin-left:auto;font-size:11px;" id="updated-at"></span>
</div>

<div class="max-w-7xl mx-auto px-4 sm:px-8 py-6 sm:py-12" id="app">
  <p class="text-slate-400 text-center py-20">データ読み込み中...</p>
</div>

<script>
const FMT = (n) => n ? n.toLocaleString() : '0';
const PCT = (n) => n ? (n * 100).toFixed(1) + '%' : '-';
const YEN = (n) => '¥' + FMT(n);

async function init() {
  const [data, memos, vendorData, periodTarget, staffData] = await Promise.all([
    fetch('sales-data.json', { cache: 'no-cache' }).then(r => r.json()),
    fetch('/api/memos').then(r => { if(!r.ok) throw new Error(); return r.json(); }).catch(() => fetch('vendor-memos.json', { cache: 'no-cache' }).then(r => r.json()).catch(() => ({ projects: [] }))),
    fetch('vendor-data.json', { cache: 'no-cache' }).then(r => r.json()).catch(() => ({ months: [] })),
    fetch('period-target.json', { cache: 'no-cache' }).then(r => r.json()).catch(() => null),
    fetch('staff-data.json', { cache: 'no-cache' }).then(r => r.json()).catch(() => null)
  ]);

  // 外注費の実績（請求書ベース）を period → 千円 で引けるように
  const costByPeriod = {};
  (vendorData.months || []).forEach(m => {
    const ex = m.totalExTax != null ? m.totalExTax
      : (m.entries || []).reduce((s, e) => s + (e.amountExTax || 0), 0);
    costByPeriod[m.period] = { exTax: ex, count: (m.entries || []).length };
  });

  // プロジェクト管理のデータを月別に集計（7月〜6月の期）
  const projects = memos.projects || [];
  const projectSummary = { totalContract: 0, totalYomi: 0, totalVendorCost: 0, projectCount: projects.filter(p => p.status === 'active').length, proposalCount: projects.filter(p => p.status === 'proposal').length };
  const vendorByMonth = {}; // { '2026-03': { cost: 0, count: 0 } }
  projects.forEach(p => {
    if (p.status === 'proposal') {
      projectSummary.totalYomi += p.contractAmount || 0;
    } else {
      projectSummary.totalContract += p.contractAmount || 0;
    }
    (p.vendors || []).forEach(v => {
      const amt = v.amountTax || v.amount || 0;
      projectSummary.totalVendorCost += amt;
      const m = v.expectedMonth;
      if (m) {
        if (!vendorByMonth[m]) vendorByMonth[m] = { cost: 0, count: 0 };
        vendorByMonth[m].cost += amt;
        vendorByMonth[m].count++;
      }
    });
  });

  document.getElementById('updated-at').textContent = '更新: ' + new Date(data.generatedAt).toLocaleString('ja-JP');

  const cp = data.currentPeriod;
  const summary = data.summary;
  // 期通年（前期＋後期）のヨミ集計。generate-sales-data.js が出力する
  const pf = data.periodForecast;

  // Previous period for comparison
  const latestSummary = summary[summary.length - 1];
  const prevSummary = summary[summary.length - 2];
  const target = (periodTarget && periodTarget.target) || 95400;

  // Classify clients
  const govClients = ['埼玉県庁', '物産観光協会'];
  const govSales = cp.clients.filter(c => govClients.includes(c.name)).reduce((s, c) => s + c.totalSales, 0);
  const govYomi = cp.clients.filter(c => govClients.includes(c.name)).reduce((s, c) => s + c.totalYomi, 0);
  const privSales = cp.totalSales - govSales;
  const privYomi = cp.totalYomi - govYomi;

  const months = cp.months || ['1月','2月','3月','4月','5月','6月'];
  const maxMonthSales = Math.max(...Object.values(cp.monthTotals).map(m => m.sales));

  // 外注実績（vendor-data.json）を月次に対応づけ
  const monthToPeriod = {};
  months.forEach(m => {
    const n = parseInt(m, 10);
    monthToPeriod[m] = '2026-' + String(n).padStart(2, '0');
  });

  let html = '';

  // ===== Header =====
  html += `
  <div class="mb-10">
    <h1 class="text-2xl sm:text-3xl font-bold text-slate-900">売上ダッシュボード</h1>
    <p class="text-body mt-1">株式会社スキーマ — ${pf ? pf.period + '（' + pf.range + '）' : cp.period}<span class="text-sm text-slate-400 ml-2">単位：千円・税抜</span></p>
  </div>`;

  // ===== KPI Cards（通期ベース。単位は千円・税抜） =====
  // 確定契約のうち、ヨミ表に1円も入っていないもの（＝Excel未入力）を通期ヨミに足し戻す。
  // Excelに入力されれば yomi が埋まり自動的にゼロになるので二重計上しない。
  const allContracts = (periodTarget && periodTarget.confirmedContracts) || [];
  const unbookedContracts = allContracts.filter(c => !c.yomi);
  const unbookedTotal = unbookedContracts.reduce((s, c) => s + c.amount, 0);

  const excelTotal = pf ? pf.current.total : cp.totalSales;
  const yomiTotal = excelTotal + unbookedTotal;
  const yomiGov = (pf ? pf.current.govTotal : govSales) + unbookedTotal;
  const yomiPriv = pf ? pf.current.privTotal : privSales;
  const prevTotal = pf ? pf.previous.total : 0;
  const prevGov = pf ? pf.previous.govTotal : 0;
  const prevPriv = pf ? pf.previous.privTotal : 0;
  const yomiProgress = yomiTotal / target;
  const h1 = pf ? pf.current.monthTotals.filter(m => m.sheet === '2026年7-12').reduce((s, m) => s + m.sales, 0) : cp.totalSales;
  const h2 = pf ? pf.current.monthTotals.filter(m => m.sheet === '2027年1-6').reduce((s, m) => s + m.sales, 0) : 0;

  html += `
  <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 sm:gap-6 mb-8">
    <!-- 通期ヨミ -->
    <div class="bg-white rounded-xl border border-slate-200 p-6 shadow-sm">
      <p class="text-xs font-medium text-slate-500 uppercase tracking-wider">通期ヨミ（第十八期）</p>
      <p class="text-lg sm:text-2xl font-bold text-slate-900 mt-2">${YEN(yomiTotal)}<span class="text-sm font-normal text-slate-400 ml-1">千円</span></p>
      <div class="mt-3 bg-slate-200 rounded-full h-2">
        <div class="bg-primary-500 rounded-full h-2 bar-fill" style="width:${Math.min(yomiProgress * 100, 100)}%"></div>
      </div>
      <p class="text-xs text-slate-400 mt-1">目標 ${YEN(target)}千円の <strong class="text-slate-700">${PCT(yomiProgress)}</strong></p>
      ${unbookedTotal ? `<p class="text-xs text-emerald-600 mt-1">Excel ${FMT(excelTotal)} ＋ 未入力の確定契約 ${FMT(unbookedTotal)}</p>` : ''}
    </div>

    <!-- 半期別 -->
    <div class="bg-white rounded-xl border border-slate-200 p-6 shadow-sm">
      <p class="text-xs font-medium text-slate-500 uppercase tracking-wider">前期 / 後期</p>
      <p class="text-lg sm:text-2xl font-bold text-slate-900 mt-2">${YEN(h1)}<span class="text-sm font-normal text-slate-400 ml-1">千円</span></p>
      <p class="text-xs text-slate-400 mt-2">2026年7-12月</p>
      <p class="text-sm font-bold text-slate-700 mt-1">${YEN(h2)}<span class="text-xs font-normal text-slate-400 ml-1">千円</span> <span class="text-xs font-normal text-slate-400">2027年1-6月</span></p>
    </div>

    <!-- 行政 -->
    <div class="bg-white rounded-xl border border-slate-200 p-6 shadow-sm">
      <p class="text-xs font-medium text-slate-500 uppercase tracking-wider">行政案件</p>
      <p class="text-lg sm:text-2xl font-bold text-slate-900 mt-2">${YEN(yomiGov)}<span class="text-sm font-normal text-slate-400 ml-1">千円</span></p>
      <p class="text-xs text-slate-400 mt-2">通期の <strong class="text-slate-700">${PCT(yomiGov / yomiTotal)}</strong></p>
      <p class="text-xs ${yomiGov >= prevGov ? 'text-emerald-600' : 'text-amber-600'}">第十七期比 ${PCT(prevGov ? yomiGov / prevGov : 0)}（${FMT(prevGov)}）</p>
    </div>

    <!-- 民間 -->
    <div class="bg-white rounded-xl border border-slate-200 p-6 shadow-sm">
      <p class="text-xs font-medium text-slate-500 uppercase tracking-wider">民間案件</p>
      <p class="text-lg sm:text-2xl font-bold text-slate-900 mt-2">${YEN(yomiPriv)}<span class="text-sm font-normal text-slate-400 ml-1">千円</span></p>
      <p class="text-xs text-slate-400 mt-2">通期の <strong class="text-slate-700">${PCT(yomiPriv / yomiTotal)}</strong></p>
      <p class="text-xs ${yomiPriv >= prevPriv ? 'text-emerald-600' : 'text-red-600'}">第十七期比 ${PCT(prevPriv ? yomiPriv / prevPriv : 0)}（${FMT(prevPriv)}）</p>
    </div>
  </div>`;

  // ===== プロジェクト管理連動 =====
  const profitMargin = projectSummary.totalContract > 0 ? (projectSummary.totalContract - projectSummary.totalVendorCost) / projectSummary.totalContract : 0;
  html += `
  <div class="bg-white rounded-xl border border-slate-200 p-4 sm:p-6 shadow-sm mb-8">
    <div class="flex flex-wrap items-center justify-between gap-2 mb-4">
      <h2 class="text-sm font-bold text-slate-900">プロジェクト管理連動</h2>
      <a href="vendor-memo.html" class="text-xs text-primary-500 hover:text-primary-700">詳細 →</a>
    </div>
    <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">
      <div class="p-3 bg-slate-50 rounded-lg">
        <p class="text-xs text-slate-500">案件数</p>
        <p class="text-lg font-bold text-slate-900">${projectSummary.projectCount}件<span class="text-sm font-normal text-violet-500 ml-1">${projectSummary.proposalCount ? '+提案' + projectSummary.proposalCount + '件' : ''}</span></p>
      </div>
      <div class="p-3 bg-slate-50 rounded-lg">
        <p class="text-xs text-slate-500">確定 + ヨミ</p>
        <p class="text-lg font-bold text-slate-900">${YEN(projectSummary.totalContract)}</p>
        ${projectSummary.totalYomi ? '<p class="text-xs text-violet-500">ヨミ ' + YEN(projectSummary.totalYomi) + '</p>' : ''}
      </div>
      <div class="p-3 bg-slate-50 rounded-lg">
        <p class="text-xs text-slate-500">外注費合計</p>
        <p class="text-lg font-bold text-slate-900">${YEN(projectSummary.totalVendorCost)}</p>
      </div>
      <div class="p-3 bg-slate-50 rounded-lg">
        <p class="text-xs text-slate-500">粗利率</p>
        <p class="text-lg font-bold ${profitMargin >= 0.5 ? 'text-emerald-600' : profitMargin >= 0.3 ? 'text-amber-600' : 'text-red-600'}">${projectSummary.totalContract ? PCT(profitMargin) : '-'}</p>
      </div>
    </div>
  </div>`;


  // ===== 第十八期 通期トラッカー（売上Excelのヨミ表ベース・税抜） =====
  if (periodTarget && pf) {
    const contracts = periodTarget.confirmedContracts || [];
    const contractTotal = contracts.reduce((s, c) => s + c.amount, 0);       // 契約ベース（税抜）
    const contractYomi  = contracts.reduce((s, c) => s + (c.yomi || 0), 0);  // ヨミ表に入力済み
    const govGap = Math.max(contractTotal - contractYomi, 0);                // 行政の未計上
    const pipe = (periodTarget.pipeline || []).reduce((s, p) => s + p.amount, 0);
    const greeInfo = periodTarget.greeAnnual || null;
    const gree = greeInfo ? greeInfo.amount : 0;

    // 第十七期にあって今期ヨミがゼロの民間。GREEは別枠で立てるので除く
    const missing = (pf.missingPrivate || []).filter(m => !/^GREE/.test(m.name));
    const missingTotal = missing.reduce((s, m) => s + m.amount, 0);

    // 行政比率の推移
    const ph = pf.history || [];
    const maxPeriodTotal = Math.max(...ph.map(p => p.total), 1);

    // ===== 2億円までの積み上げラダー =====
    const steps = [
      { label: '現在のヨミ', add: yomiTotal,
        note: 'Excel入力 ' + FMT(excelTotal) + (unbookedTotal ? ' ＋ 未入力の確定契約 ' + FMT(unbookedTotal) + '（' + unbookedContracts.map(c => c.name).join('・') + '）' : '') + '。行政 ' + FMT(yomiGov) + ' ／ 民間 ' + FMT(yomiPriv),
        cls: 'bg-primary-500', chip: 'bg-primary-100 text-primary-700' },
      { label: 'GREE 2案件', add: gree,
        note: greeInfo ? greeInfo.detail : '',
        cls: 'bg-emerald-300', chip: 'bg-emerald-100 text-emerald-700' },
      { label: '官民連携アドバイザー', add: pipe,
        note: '提案〆8/20。受注できれば',
        cls: 'bg-amber-300', chip: 'bg-amber-100 text-amber-700' },
      { label: '第十七期の民間常連', add: missingTotal,
        note: 'GREE以外の' + missing.length + '社が丸ごと戻った場合。' + missing.slice(0, 3).map(m => m.name + ' ' + FMT(m.amount)).join(' / ') + ' ほか',
        cls: 'bg-amber-200', chip: 'bg-amber-100 text-amber-700' },
    ].filter(s => s.add > 0);

    let run = 0;
    const ladder = steps.map(s => { run += s.add; return Object.assign({}, s, { cum: run, pct: run / target }); });
    const best = run;
    const stillShort = Math.max(target - best, 0);

    let barHtml = '';
    ladder.forEach(s => {
      const w = target > 0 ? (s.add / target * 100) : 0;
      if (w <= 0) return;
      barHtml += '<div class="' + s.cls + ' h-full" style="width:' + w + '%" title="' + s.label + ' +' + FMT(s.add) + '千円"></div>';
    });
    if (stillShort > 0) {
      barHtml += '<div class="bg-slate-200 h-full" style="width:' + (stillShort / target * 100) + '%" title="不足 ' + FMT(stillShort) + '千円"></div>';
    }

    html += `
    <div class="bg-white rounded-xl border-2 border-primary-200 p-5 sm:p-6 shadow-sm mb-8">
      <div class="flex items-baseline justify-between flex-wrap gap-2 mb-1">
        <h2 class="text-sm font-bold text-slate-900">${pf.period} 目標2億円までの積み上げ</h2>
        <span class="text-xs text-slate-400">売上Excelのヨミ表ベース／単位：千円・税抜</span>
      </div>
      <p class="text-xs text-body mb-4">いま入力されているヨミは <strong>${FMT(yomiTotal)}</strong>（目標の ${PCT(yomiTotal / target)}）。ここに「契約済みだが未入力」「例年立っているが未入力」を順に足すと、どこまで届くかが見える。</p>

      <div class="flex h-7 rounded-lg overflow-hidden bg-slate-100 mb-3">${barHtml}</div>

      <div class="overflow-x-auto mb-4">
        <table class="w-full text-sm">
          <thead>
            <tr class="border-b border-slate-200 bg-gray-50">
              <th scope="col" class="text-left py-2 px-3 text-xs font-medium text-slate-500">積み上げ</th>
              <th scope="col" class="text-right py-2 px-3 text-xs font-medium text-slate-500">金額</th>
              <th scope="col" class="text-right py-2 px-3 text-xs font-medium text-slate-500">累計</th>
              <th scope="col" class="text-right py-2 px-3 text-xs font-medium text-slate-500">対目標</th>
              <th scope="col" class="text-left py-2 px-3 text-xs font-medium text-slate-500 hidden md:table-cell">内容</th>
            </tr>
          </thead>
          <tbody>
            ${ladder.map((s, i) => `
            <tr class="border-b border-slate-100 hover:bg-gray-50 transition-colors">
              <td class="py-2.5 px-3"><span class="${s.chip} px-2 py-0.5 rounded-full text-xs font-medium">${i === 0 ? s.label : '＋' + s.label}</span></td>
              <td class="py-2.5 px-3 text-right text-body">${i === 0 ? '' : '+'}${FMT(s.add)}</td>
              <td class="py-2.5 px-3 text-right font-bold text-slate-900">${FMT(s.cum)}</td>
              <td class="py-2.5 px-3 text-right font-medium ${s.pct >= 1 ? 'text-emerald-700' : s.pct >= 0.8 ? 'text-amber-700' : 'text-slate-500'}">${PCT(s.pct)}</td>
              <td class="py-2.5 px-3 text-xs text-slate-500 hidden md:table-cell">${s.note}</td>
            </tr>`).join('')}
            <tr class="${stillShort > 0 ? 'bg-red-50/60' : 'bg-emerald-50/60'}">
              <td class="py-2.5 px-3 text-sm font-bold ${stillShort > 0 ? 'text-red-800' : 'text-emerald-800'}">目標まで</td>
              <td class="py-2.5 px-3 text-right font-bold ${stillShort > 0 ? 'text-red-700' : 'text-emerald-700'}">${stillShort > 0 ? '△' + FMT(stillShort) : '達成'}</td>
              <td class="py-2.5 px-3 text-right font-bold text-slate-900">${FMT(target)}</td>
              <td class="py-2.5 px-3 text-right font-bold text-slate-500">100.0%</td>
              <td class="py-2.5 px-3 text-xs ${stillShort > 0 ? 'text-red-700' : 'text-emerald-700'} hidden md:table-cell">上の全部が積み上がっても <strong>${FMT(stillShort)}千円</strong> 足りない</td>
            </tr>
          </tbody>
        </table>
      </div>

      <div class="rounded-lg ${stillShort > 0 ? 'bg-red-50 border-red-200' : 'bg-emerald-50 border-emerald-200'} border p-4">
        <p class="text-sm font-bold ${stillShort > 0 ? 'text-red-800' : 'text-emerald-800'} mb-1">読み方</p>
        <p class="text-xs ${stillShort > 0 ? 'text-red-700' : 'text-emerald-700'} leading-relaxed">
          行政は失注が重なり <strong>${FMT(yomiGov)}</strong>（第十七期 ${FMT(prevGov)} の ${PCT(yomiGov / prevGov)}）。
          民間が第十七期と同水準まで戻り、提案中の1件も取れて、ようやく <strong>${FMT(best)}</strong>。
          つまり <strong>2億円は「例年通り」の延長線上には無い</strong>。
          上積みが要るのは民間の新規で、必要額は <strong>${FMT(stillShort)}千円</strong>。
        </p>
      </div>
    </div>`;

    // ===== 行政の確定契約（契約 vs ヨミ計上） =====
    let cRows = '';
    contracts.forEach(c => {
      const d = (c.yomi || 0) - c.amount;
      cRows += `
        <tr class="border-b border-slate-100">
          <td class="py-2 px-3 text-sm text-slate-900">${c.name}</td>
          <td class="py-2 px-3 text-xs text-slate-400 hidden lg:table-cell">${c.source || ''}</td>
          <td class="py-2 px-3 text-sm text-right text-body">${FMT(c.amount)}</td>
          <td class="py-2 px-3 text-sm text-right ${(c.yomi || 0) === 0 ? 'text-red-600 font-bold' : 'text-slate-900'}">${FMT(c.yomi || 0)}</td>
          <td class="py-2 px-3 text-xs text-right ${d < -50 ? 'text-red-600' : 'text-slate-400'}">${d < -50 ? FMT(d) : '—'}</td>
        </tr>`;
    });

    let pRows = '';
    (periodTarget.pipeline || []).forEach(p => {
      pRows += `
        <tr class="border-b border-slate-100">
          <td class="py-2 px-3 text-sm text-slate-700">${p.name}</td>
          <td class="py-2 px-3 text-xs text-slate-400 hidden sm:table-cell">${p.detail || ''}</td>
          <td class="py-2 px-3 text-sm text-right text-slate-700">${FMT(p.amount)}</td>
        </tr>`;
    });

    html += `
    <div class="grid grid-cols-1 xl:grid-cols-2 gap-6 mb-8">
      <div class="bg-white rounded-xl border border-slate-200 p-5 sm:p-6 shadow-sm">
        <div class="flex items-baseline justify-between flex-wrap gap-2 mb-1">
          <h2 class="text-sm font-bold text-slate-900">行政の確定契約（${contracts.length}件）</h2>
          <span class="text-xs text-slate-400">契約は税抜換算（÷1.1）</span>
        </div>

    const pMonths = ['1月','2月','3月','4月','5月','6月'];
    pMonths.forEach(m => pm[m] = 0);
    prevSheet.clients.forEach(c => c.entries.forEach(e => { if (pm[e.month] != null) pm[e.month] += e.sales; }));
    const pTotal = pMonths.reduce((s, m) => s + pm[m], 0);
    const pMax = Math.max(...pMonths.map(m => pm[m]));

    let pRows = '';
    pMonths.forEach(m => {
      const sales = pm[m];
      const c = costByPeriod['2026-' + String(parseInt(m, 10)).padStart(2, '0')];
      const cost = c ? Math.round(c.exTax / 1000) : null;
      const gp = cost != null ? sales - cost : null;
      const rate = (cost != null && sales > 0) ? (cost / sales) : null;
      const pct = pMax > 0 ? (sales / pMax * 100) : 0;
      pRows += `
        <div class="flex items-center gap-3">
          <span class="w-8 text-xs text-slate-500 text-right">${m}</span>
          <div class="flex-1 bg-slate-100 rounded h-5 relative overflow-hidden">
            <div class="bg-slate-400 h-5 rounded bar-fill" style="width:${pct}%"></div>
          </div>
          <span class="w-20 text-xs text-right font-medium text-slate-700">${FMT(sales)}</span>
          <span class="w-16 text-xs text-right text-slate-400">${cost != null ? FMT(cost) : '—'}</span>
          <span class="w-16 text-xs text-right ${gp != null ? 'text-slate-600' : 'text-slate-300'}">${gp != null ? FMT(gp) : '—'}</span>
          <span class="w-14 text-xs text-right ${rate == null ? 'text-slate-300' : rate >= 0.6 ? 'text-red-600' : rate >= 0.4 ? 'text-amber-600' : 'text-emerald-600'}">${rate != null ? PCT(rate) : '—'}</span>
        </div>`;
    });

    let pCost = 0;
    pMonths.forEach(m => { const c = costByPeriod['2026-' + String(parseInt(m, 10)).padStart(2, '0')]; if (c) pCost += Math.round(c.exTax / 1000); });

    html += `
    <div class="bg-white rounded-xl border border-slate-200 p-6 shadow-sm mb-8">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-sm font-bold text-slate-900">直前の半期実績（2026年1-6月＝第十七期 後期）</h2>
        <span class="text-xs text-slate-400">売上 ${FMT(pTotal)}千円 ／ 外注 ${FMT(pCost)}千円 ／ 粗利 ${FMT(pTotal - pCost)}千円 ／ 原価率 ${PCT(pCost / pTotal)}</span>
      </div>
      <div class="flex items-center gap-3 mb-2 text-[10px] text-slate-400 font-medium">
        <span class="w-8"></span><span class="flex-1"></span>
        <span class="w-20 text-right">売上</span><span class="w-16 text-right">外注</span>
        <span class="w-16 text-right">粗利</span><span class="w-14 text-right">原価率</span>
      </div>
      <div class="space-y-2">${pRows}</div>
    </div>`;
  }

  // ===== 期別比較テーブル（第◯期どうしを並べて比較） =====
  // 期は7月開始（第一期 = 2009.7〜2010.6）。Excelの「前期」＝7-12月 /「後期」＝1-6月
  const kiNum = (range) => { const m = String(range).match(/(\d{4})\./); return m ? Number(m[1]) - 2009 + 1 : null; };
  // 請求書実績から期別の外注費（税抜・千円）を算出 — Excelの外注費列は近年未入力のため
  const costByKi = {};
  (vendorData.months || []).forEach(mo => {
    const ex = mo.totalExTax != null ? mo.totalExTax : (mo.entries || []).reduce((s, e) => s + (e.amountExTax || 0), 0);
    if (!ex) return;
    const [y, mm] = mo.period.split('-').map(Number);
    const k = (mm >= 7 ? y : y - 1) - 2009 + 1;
    if (!costByKi[k]) costByKi[k] = { cost: 0, months: 0 };
    costByKi[k].cost += ex / 1000;
    costByKi[k].months++;
  });

  const compare = summary.slice(-8).map(p => {
    const k = kiNum(p.range);
    const actual = costByKi[k];
    const cost = actual ? Math.round(actual.cost) : (p.totalCost || 0);
    const costSrc = actual ? (actual.months >= 12 ? 'full' : 'partial') : 'excel';
    return {
      period: p.period, range: p.range, ki: k,
      h1: p.firstHalf, h2: p.secondHalf, total: p.total,
      growth: p.totalGrowth, team: p.team,
      cost, costSrc, months: actual ? actual.months : 0,
      profit: p.total - cost,
      rate: p.total > 0 ? cost / p.total : 0,
      isCurrent: k === kiNum(summary[summary.length - 1].range),
    };
  });
  const maxTotal = Math.max(...compare.map(c => c.total));

  let cmpRows = '';
  compare.forEach(c => {
    const bar = maxTotal > 0 ? (c.total / maxTotal * 100) : 0;
    const h1pct = c.total > 0 ? (c.h1 / c.total * 100) : 0;
    const growthCls = c.growth == null ? 'text-slate-300' : c.growth >= 1 ? 'text-emerald-600' : 'text-red-500';
    const rateCls = c.rate >= 0.6 ? 'text-red-600' : c.rate >= 0.4 ? 'text-amber-600' : 'text-emerald-600';
    const note = c.costSrc === 'partial' ? `<span class="text-[10px] text-amber-600 ml-1">${c.months}ヶ月</span>`
      : c.costSrc === 'excel' ? '<span class="text-[10px] text-slate-400 ml-1">Excel</span>' : '';
    cmpRows += `
      <tr class="border-b border-slate-100 hover:bg-gray-50 transition-colors ${c.isCurrent ? 'bg-primary-50/40' : ''}">
        <td class="py-2.5 px-4 text-sm font-medium ${c.isCurrent ? 'text-primary-700' : 'text-slate-900'}">${c.period}${c.isCurrent ? '<span class="ml-1 px-1.5 py-0.5 rounded-full text-[10px] bg-primary-200 text-primary-900 font-semibold">進行中</span>' : ''}</td>
        <td class="py-2.5 px-4 text-xs text-slate-400 hidden sm:table-cell">${c.range}</td>
        <td class="py-2.5 px-4 text-sm text-right text-body">${c.h1 ? FMT(c.h1) : '—'}</td>
        <td class="py-2.5 px-4 text-sm text-right text-body">${c.h2 ? FMT(c.h2) : '—'}</td>
        <td class="py-2.5 px-4 text-sm text-right font-bold text-slate-900">${FMT(c.total)}</td>
        <td class="py-2.5 px-4 text-sm text-right ${growthCls}">${c.growth != null ? PCT(c.growth) : '—'}</td>
        <td class="py-2.5 px-4 text-sm text-right text-body">${FMT(c.cost)}${note}</td>
        <td class="py-2.5 px-4 text-sm text-right font-medium text-emerald-700">${FMT(c.profit)}</td>
        <td class="py-2.5 px-4 text-sm text-right font-medium ${rateCls}">${PCT(c.rate)}</td>
        <td class="py-2.5 px-4 w-32 hidden lg:table-cell">
          <div class="bg-slate-100 rounded h-4 relative overflow-hidden" title="7-12月 ${FMT(c.h1)}千 / 1-6月 ${FMT(c.h2)}千">
            <div class="absolute inset-y-0 left-0 ${c.isCurrent ? 'bg-primary-500' : 'bg-slate-400'} rounded-l" style="width:${bar * h1pct / 100}%"></div>
            <div class="absolute inset-y-0 ${c.isCurrent ? 'bg-primary-300' : 'bg-slate-300'}" style="left:${bar * h1pct / 100}%; width:${bar * (100 - h1pct) / 100}%"></div>
          </div>
        </td>
      </tr>`;
  });

  html += `
  <div class="bg-white rounded-xl border border-slate-200 overflow-hidden shadow-sm mb-8">
    <div class="px-6 py-4 border-b border-slate-200 bg-gray-50 flex items-center justify-between flex-wrap gap-2">
      <h2 class="text-sm font-bold text-slate-900">期別売上比較（直近8期）</h2>
      <span class="text-xs text-slate-400">期は7月開始 ／ 外注費は請求書実績（税抜）</span>
    </div>
    <div class="overflow-x-auto">
      <table class="w-full">
        <thead>
          <tr class="border-b border-slate-200 bg-gray-50">
            <th scope="col" class="text-left py-3 px-4 text-xs font-medium text-slate-500 uppercase tracking-wider">期</th>
            <th scope="col" class="text-left py-3 px-4 text-xs font-medium text-slate-500 uppercase tracking-wider hidden sm:table-cell">期間</th>
            <th scope="col" class="text-right py-3 px-4 text-xs font-medium text-slate-500 uppercase tracking-wider">前期<br><span class="font-normal normal-case">7-12月</span></th>
            <th scope="col" class="text-right py-3 px-4 text-xs font-medium text-slate-500 uppercase tracking-wider">後期<br><span class="font-normal normal-case">1-6月</span></th>
            <th scope="col" class="text-right py-3 px-4 text-xs font-medium text-slate-500 uppercase tracking-wider">年間売上</th>
            <th scope="col" class="text-right py-3 px-4 text-xs font-medium text-slate-500 uppercase tracking-wider">前年比</th>
            <th scope="col" class="text-right py-3 px-4 text-xs font-medium text-slate-500 uppercase tracking-wider">外注費</th>
            <th scope="col" class="text-right py-3 px-4 text-xs font-medium text-slate-500 uppercase tracking-wider">粗利</th>
            <th scope="col" class="text-right py-3 px-4 text-xs font-medium text-slate-500 uppercase tracking-wider">原価率</th>
            <th scope="col" class="text-left py-3 px-4 text-xs font-medium text-slate-500 uppercase tracking-wider hidden lg:table-cell">構成</th>
          </tr>
        </thead>
        <tbody>${cmpRows}</tbody>
      </table>
    </div>
    <div class="px-6 py-3 bg-slate-50 border-t border-slate-200">
      <p class="text-xs text-body">単位: 千円。濃い色＝前期(7-12月) / 薄い色＝後期(1-6月)。外注費は <code class="bg-white px-1 rounded">vendor-data.json</code> の請求書実績（税抜）を使用。売上Excelの外注費列は第十六期後期以降が未入力のため、そのままでは粗利が過大になります。<span class="text-amber-700">「◯ヶ月」表示は期の途中で、まだ全月分が揃っていないことを示します。</span></p>
    </div>
  </div>`;

  // ===== Client Table =====
  const maxClientSales = Math.max(...cp.clients.map(c => c.totalSales + c.totalYomi));

  html += `
  <div class="bg-white rounded-xl border border-slate-200 overflow-hidden shadow-sm mb-8">
    <div class="px-6 py-4 border-b border-slate-200 bg-gray-50 flex items-center justify-between">
      <h2 class="text-sm font-bold text-slate-900">クライアント別売上</h2>
      <span class="text-xs text-slate-400">${cp.clients.length}社</span>
    </div>
    <table class="w-full">
      <thead>
        <tr class="border-b border-slate-200 bg-gray-50">
          <th scope="col" class="text-left py-3 px-4 text-xs font-medium text-slate-500 uppercase tracking-wider w-48">クライアント</th>
          <th scope="col" class="text-right py-3 px-4 text-xs font-medium text-slate-500 uppercase tracking-wider w-24">確定</th>
          <th scope="col" class="text-right py-3 px-4 text-xs font-medium text-slate-500 uppercase tracking-wider w-24">ヨミ</th>
          <th scope="col" class="text-left py-3 px-4 text-xs font-medium text-slate-500 uppercase tracking-wider">月別内訳</th>
          <th scope="col" class="text-center py-3 px-4 text-xs font-medium text-slate-500 uppercase tracking-wider w-20">区分</th>
        </tr>
      </thead>
      <tbody>`;

  cp.clients.forEach(c => {
    const isGov = govClients.includes(c.name);
    const barW = maxClientSales > 0 ? ((c.totalSales + c.totalYomi) / maxClientSales * 100) : 0;

    // Month sparkline
    let sparkHtml = '<div class="flex items-end gap-0.5 h-5">';
    months.forEach(m => {
      const v = c.byMonth[m] || 0;
      const h = maxClientSales > 0 ? Math.max(2, v / maxClientSales * 100) : 2;
      sparkHtml += `<div class="sparkbar bg-primary-${v > 0 ? '400' : '100'}" style="width:12px;height:${v > 0 ? h + '%' : '2px'}" title="${m}: ${FMT(v)}千円"></div>`;
    });
    sparkHtml += '</div>';

    html += `
        <tr class="hover:bg-gray-50 transition-colors border-b border-slate-100">
          <td class="py-3 px-4">
            <span class="text-sm font-medium text-slate-900">${c.name}</span>
          </td>
          <td class="py-3 px-4 text-right">
            <span class="text-sm font-medium text-slate-900">${FMT(c.totalSales)}</span>
          </td>
          <td class="py-3 px-4 text-right">
            ${c.totalYomi > 0 ? `<span class="text-sm text-emerald-600">${FMT(c.totalYomi)}</span>` : '<span class="text-xs text-slate-300">-</span>'}
          </td>
          <td class="py-3 px-4">${sparkHtml}</td>
          <td class="py-3 px-4 text-center">
            <span class="px-2 py-0.5 rounded-full text-xs font-medium ${isGov ? 'bg-amber-50 text-amber-700' : 'bg-slate-100 text-slate-600'}">${isGov ? '行政' : '民間'}</span>
          </td>
        </tr>`;
  });

  html += `
      </tbody>
    </table>
  </div>`;

  // ===== Actions/Pipeline =====
  const pipelineClients = cp.clients.filter(c => c.totalYomi > 0);
  if (pipelineClients.length > 0) {
    html += `
    <div class="bg-white rounded-xl border border-slate-200 p-6 shadow-sm mb-8">
      <h2 class="text-sm font-bold text-slate-900 mb-4">パイプライン（ヨミ案件）</h2>
      <div class="space-y-3">`;

    pipelineClients.forEach(c => {
      html += `
        <div class="flex items-center gap-4 py-2">
          <span class="text-sm font-medium text-slate-900 w-40">${c.name}</span>
          <div class="flex-1 bg-slate-100 rounded h-4">
            <div class="bg-emerald-400 h-4 rounded bar-fill" style="width:${c.totalYomi / Math.max(...pipelineClients.map(p => p.totalYomi)) * 100}%"></div>
          </div>
          <span class="text-sm font-medium text-emerald-600 w-28 text-right">${YEN(c.totalYomi)}千円</span>
        </div>`;
    });

    html += `
      </div>
      <div class="mt-4 pt-4 border-t border-slate-200 flex justify-between">
        <span class="text-xs text-slate-500">パイプライン合計</span>
        <span class="text-sm font-bold text-emerald-600">${YEN(cp.totalYomi)}千円</span>
      </div>
    </div>`;
  }

  // ===== Footer note =====
  html += `
  <div class="mt-8 pt-6 border-t border-slate-200 flex items-center justify-between">
    <p class="text-xs text-slate-400">
      データソース: 2026年7-12月 SCHEMA,Inc.売上.xlsx
      &mdash; <code class="bg-slate-100 px-1 rounded">node sales/generate-sales-data.js</code> で更新
    </p>
    <p class="text-xs text-slate-400">&copy;2026 SCHEMA, Inc.</p>
  </div>`;

  document.getElementById('app').innerHTML = html;
}

init().catch(e => {
  document.getElementById('app').innerHTML = `<p class="text-red-500 text-center py-20">エラー: ${e.message}<br><span class="text-xs text-slate-400">sales-data.json が同じディレクトリにあるか確認してください</span></p>`;
});
</script>
</body>
</html>
