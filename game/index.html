<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STUDY QUEST - 勉強クエスト</title>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after { margin:0; padding:0; box-sizing:border-box; }

  :root {
    --black: #000000;
    --white: #ffffff;
    --yellow: #ffff00;
    --red: #ff0000;
    --orange: #ff6600;
    --hp-yellow: #ffff00;
    --soul-red: #ff0000;
    --gray: #808080;
    --dark-gray: #333333;
    --border: 3px solid var(--white);
  }

  body {
    background: var(--black);
    color: var(--white);
    font-family: 'DotGothic16', 'Press Start 2P', monospace;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    image-rendering: pixelated;
  }

  /* ===== Pixel Font Classes ===== */
  .font-pixel { font-family: 'Press Start 2P', monospace; }
  .font-jp { font-family: 'DotGothic16', monospace; }

  /* ===== App Container ===== */
  #app {
    width: 100%;
    max-width: 640px;
    padding: 16px;
    position: relative;
  }

  /* ===== Soul Heart ===== */
  .soul {
    display: inline-block;
    width: 16px; height: 16px;
    position: relative;
  }
  .soul::before, .soul::after {
    content: '';
    position: absolute;
    background: var(--soul-red);
  }
  .soul::before {
    width: 16px; height: 12px;
    bottom: 0; left: 0;
    clip-path: polygon(50% 100%, 0 0, 100% 0);
  }
  .soul::after {
    width: 16px; height: 8px;
    top: 0; left: 0;
    border-radius: 50% 50% 0 0;
    background: linear-gradient(90deg, var(--soul-red) 0%, var(--soul-red) 45%, transparent 45%, transparent 55%, var(--soul-red) 55%);
    /* Two half circles */
  }

  /* Better soul using SVG inline */
  .soul-heart {
    fill: var(--soul-red);
    width: 18px; height: 18px;
    vertical-align: middle;
    filter: drop-shadow(0 0 4px rgba(255,0,0,0.5));
  }
  .soul-heart-large {
    fill: var(--soul-red);
    width: 48px; height: 48px;
    filter: drop-shadow(0 0 8px rgba(255,0,0,0.6));
  }
  .soul-heart-title {
    fill: var(--soul-red);
    width: 64px; height: 64px;
    filter: drop-shadow(0 0 12px rgba(255,0,0,0.7));
  }

  /* ===== Undertale-style Box ===== */
  .ut-box {
    border: 3px solid var(--white);
    background: var(--black);
    padding: 20px;
    position: relative;
  }

  /* ===== Boss Battle Box ===== */
  .ut-box.boss-battle {
    border-color: var(--orange);
    box-shadow: 0 0 15px rgba(255,102,0,0.3), inset 0 0 15px rgba(255,0,0,0.1);
  }

  /* ===== HP Bar (Undertale style) ===== */
  .hp-container {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .hp-label {
    font-family: 'Press Start 2P', monospace;
    font-size: 10px;
    color: var(--white);
    white-space: nowrap;
  }
  .hp-bar-bg {
    width: 120px; height: 20px;
    background: var(--red);
    position: relative;
  }
  .hp-bar-fill {
    height: 100%;
    background: var(--hp-yellow);
    transition: width 0.4s ease-out;
  }
  .hp-num {
    font-family: 'Press Start 2P', monospace;
    font-size: 10px;
    color: var(--white);
    white-space: nowrap;
  }

  /* ===== EXP Bar ===== */
  .exp-bar-bg {
    width: 100%; height: 6px;
    background: var(--dark-gray);
  }
  .exp-bar-fill {
    height: 100%;
    background: var(--yellow);
    transition: width 0.6s ease-out;
  }

  /* ===== Battle Menu Buttons (FIGHT/ACT/ITEM/MERCY style) ===== */
  .ut-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 16px;
    border: 3px solid var(--white);
    background: var(--black);
    color: var(--white);
    font-family: 'Press Start 2P', monospace;
    font-size: 11px;
    cursor: pointer;
    transition: background 0.1s;
    text-transform: uppercase;
    white-space: nowrap;
  }
  .ut-btn:hover, .ut-btn:focus {
    background: #222;
  }
  .ut-btn-selected {
    color: var(--yellow);
  }

  /* ===== Choice Buttons (Answer) ===== */
  .choice-btn {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    padding: 10px 16px;
    border: none;
    background: transparent;
    color: var(--white);
    font-family: 'DotGothic16', monospace;
    font-size: 16px;
    cursor: pointer;
    text-align: left;
    transition: color 0.1s;
  }
  .choice-btn:hover {
    color: var(--yellow);
  }
  .choice-btn:hover .choice-soul { fill: var(--soul-red); }
  .choice-soul { fill: transparent; transition: fill 0.1s; }

  /* ===== Animations ===== */
  @keyframes shake { 0%,100%{transform:translate(0)} 10%{transform:translate(-6px,-2px)} 30%{transform:translate(6px,2px)} 50%{transform:translate(-4px,4px)} 70%{transform:translate(4px,-4px)} 90%{transform:translate(-2px,2px)} }
  @keyframes hitFlash { 0%{opacity:1} 20%{opacity:0} 40%{opacity:1} 60%{opacity:0} 80%{opacity:1} 100%{opacity:1} }
  @keyframes damageFloat { 0%{transform:translateY(0);opacity:1} 100%{transform:translateY(-50px);opacity:0} }
  @keyframes soulBreak { 0%{transform:scale(1);opacity:1} 30%{transform:scale(1.3);opacity:1} 100%{transform:scale(0);opacity:0;filter:blur(4px)} }
  @keyframes fadeIn { from{opacity:0} to{opacity:1} }
  @keyframes textReveal { from{clip-path:inset(0 100% 0 0)} to{clip-path:inset(0 0 0 0)} }
  @keyframes floatBounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
  @keyframes starTwinkle { 0%,100%{opacity:0.3} 50%{opacity:1} }
  @keyframes comboFlash { 0%{color:#fff} 25%{color:#ff0} 50%{color:#f80} 75%{color:#ff0} 100%{color:#fff} }
  @keyframes bossEntrance { 0%{transform:scale(0) rotate(-180deg);opacity:0} 50%{transform:scale(1.5) rotate(0deg);opacity:1} 100%{transform:scale(1) rotate(0deg);opacity:1} }
  @keyframes bossFloat { 0%,100%{transform:translateY(0) scale(1)} 25%{transform:translateY(-12px) scale(1.02)} 50%{transform:translateY(0) scale(1)} 75%{transform:translateY(-6px) scale(1.01)} }
  @keyframes screenFlash { 0%{opacity:0} 20%{opacity:0.8} 100%{opacity:0} }
  @keyframes bossVictoryPulse { 0%{transform:scale(1);text-shadow:0 0 10px #ff0} 50%{transform:scale(1.1);text-shadow:0 0 30px #ff0,0 0 60px #f80} 100%{transform:scale(1);text-shadow:0 0 10px #ff0} }

  .shake { animation: shake 0.3s ease-in-out; }
  .hit-flash { animation: hitFlash 0.4s steps(1); }
  .damage-float { animation: damageFloat 1s ease-out forwards; }
  .soul-break { animation: soulBreak 0.8s ease-in forwards; }
  .fade-in { animation: fadeIn 0.5s ease-out; }
  .float-bounce { animation: floatBounce 2s ease-in-out infinite; }
  .combo-flash { animation: comboFlash 0.5s ease-in-out; }
  .boss-entrance { animation: bossEntrance 0.8s ease-out forwards; }
  .boss-float { animation: bossFloat 3s ease-in-out infinite; }
  .boss-victory-pulse { animation: bossVictoryPulse 1s ease-in-out infinite; }

  /* ===== Boss screen flash overlay ===== */
  .boss-flash-overlay {
    position: fixed; inset: 0; background: white; opacity: 0; pointer-events: none; z-index: 99;
    animation: screenFlash 0.6s ease-out forwards;
  }

  /* ===== Stars background ===== */
  .star {
    position: absolute;
    background: #fff;
    border-radius: 50%;
    animation: starTwinkle 3s ease-in-out infinite;
  }

  /* ===== Screens ===== */
  .screen { display: none; }
  .screen.active { display: block; }

  /* ===== Music Toggle ===== */
  .music-toggle {
    position: fixed;
    top: 12px;
    right: 12px;
    background: none;
    border: 2px solid var(--gray);
    color: var(--gray);
    font-family: 'Press Start 2P', monospace;
    font-size: 8px;
    padding: 6px 10px;
    cursor: pointer;
    z-index: 100;
  }
  .music-toggle:hover { border-color: var(--white); color: var(--white); }
  .music-toggle.on { border-color: var(--yellow); color: var(--yellow); }

  /* ===== Subject Select Grid ===== */
  .subject-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-top: 20px;
  }
  .subject-btn {
    border: 3px solid var(--white);
    background: var(--black);
    color: var(--white);
    padding: 20px 12px;
    text-align: center;
    cursor: pointer;
    transition: all 0.15s;
    font-family: 'DotGothic16', monospace;
  }
  .subject-btn:hover {
    background: #1a1a2e;
    border-color: var(--yellow);
    color: var(--yellow);
  }
  .subject-btn .emoji { font-size: 32px; margin-bottom: 8px; }
  .subject-btn .label { font-family: 'Press Start 2P', monospace; font-size: 10px; }

  /* ===== Monster Sprite Area ===== */
  .monster-area {
    text-align: center;
    padding: 30px 0;
    min-height: 160px;
    position: relative;
  }
  .monster-sprite {
    font-size: 80px;
    display: inline-block;
    animation: floatBounce 3s ease-in-out infinite;
    filter: drop-shadow(0 0 20px rgba(255,255,255,0.1));
  }
  .monster-sprite.boss-sprite {
    font-size: 110px;
    filter: drop-shadow(0 0 30px rgba(255,100,0,0.4));
  }
  .monster-name-plate {
    font-family: 'Press Start 2P', monospace;
    font-size: 12px;
    color: var(--white);
    margin-bottom: 8px;
  }
  .damage-number {
    position: absolute;
    font-family: 'Press Start 2P', monospace;
    font-size: 24px;
    color: var(--yellow);
    pointer-events: none;
    z-index: 10;
  }
  .miss-text { color: var(--gray); }

  /* ===== Text Box (dialogue) ===== */
  .text-box {
    border: 3px solid var(--white);
    background: var(--black);
    padding: 16px 20px;
    min-height: 60px;
    font-family: 'DotGothic16', monospace;
    font-size: 16px;
    line-height: 1.8;
    color: var(--white);
  }
  .text-box.boss-battle {
    border-color: var(--orange);
  }
  .text-box .asterisk {
    color: var(--white);
    margin-right: 8px;
  }

  /* ===== Overlay Screens ===== */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.95);
    align-items: center;
    justify-content: center;
    z-index: 50;
  }
  .overlay.active {
    display: flex;
  }
  .overlay-content {
    text-align: center;
    max-width: 480px;
    padding: 32px;
  }

  /* ===== Monster Book (Zukan) ===== */
  .zukan-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    margin-top: 16px;
    max-height: 400px;
    overflow-y: auto;
    padding: 4px;
  }
  .zukan-card {
    border: 2px solid var(--dark-gray);
    background: var(--black);
    padding: 10px 4px;
    text-align: center;
    min-height: 90px;
  }
  .zukan-card.defeated {
    border-color: var(--gray);
  }
  .zukan-card.boss-card.defeated {
    border-color: var(--orange);
    box-shadow: 0 0 8px rgba(255,102,0,0.2);
  }
  .zukan-emoji {
    font-size: 32px;
    display: block;
    margin-bottom: 4px;
  }
  .zukan-emoji.unknown {
    filter: brightness(0) opacity(0.3);
  }
  .zukan-name {
    font-family: 'Press Start 2P', monospace;
    font-size: 6px;
    color: var(--gray);
    word-break: break-all;
  }
  .zukan-count {
    font-family: 'Press Start 2P', monospace;
    font-size: 6px;
    color: var(--yellow);
    margin-top: 2px;
  }

  /* ===== Responsive ===== */
  @media (max-width: 480px) {
    .monster-sprite { font-size: 60px; }
    .monster-sprite.boss-sprite { font-size: 80px; }
    .ut-btn { font-size: 9px; padding: 5px 10px; }
    .choice-btn { font-size: 14px; padding: 8px 12px; }
    .zukan-grid { grid-template-columns: repeat(3, 1fr); }
  }
</style>
</head>
<body>

<button id="musicToggle" class="music-toggle" onclick="toggleMusic()">&#9834; OFF</button>

<div id="app">
  <!-- ===== Background Stars ===== -->
  <div id="stars" style="position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;"></div>

  <!-- ===== TITLE SCREEN ===== -->
  <div id="titleScreen" class="screen active" style="position:relative;z-index:1;">
    <div style="text-align:center; padding-top:40px;">
      <!-- Title -->
      <div style="margin-bottom:24px;">
        <svg class="soul-heart-title" viewBox="0 0 24 24" style="display:block;margin:0 auto 16px;">
          <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
        </svg>
        <h1 class="font-pixel" style="font-size:20px; color:var(--white); letter-spacing:4px; margin-bottom:8px;">STUDY QUEST</h1>
        <p class="font-jp" style="font-size:14px; color:var(--gray);">&#12316; 勉強クエスト &#12316;</p>
      </div>

      <!-- Subject Select -->
      <div class="ut-box" style="margin-bottom:20px;">
        <p class="font-jp" style="font-size:16px; color:var(--yellow); margin-bottom:16px;">
          * きょうかを えらんでください
        </p>
        <div class="subject-grid">
          <button class="subject-btn" onclick="startGame('math')">
            <div class="emoji">&#128520;</div>
            <div class="label">MATH</div>
            <div class="font-jp" style="font-size:12px;margin-top:4px;color:var(--gray);">さんすう</div>
          </button>
          <button class="subject-btn" onclick="startGame('japanese')">
            <div class="emoji">&#128214;</div>
            <div class="label">KOKUGO</div>
            <div class="font-jp" style="font-size:12px;margin-top:4px;color:var(--gray);">国語</div>
          </button>
          <button class="subject-btn" onclick="startGame('science')">
            <div class="emoji">&#128300;</div>
            <div class="label">SCIENCE</div>
            <div class="font-jp" style="font-size:12px;margin-top:4px;color:var(--gray);">理科</div>
          </button>
          <button class="subject-btn" onclick="startGame('social')">
            <div class="emoji">&#127759;</div>
            <div class="label">SOCIAL</div>
            <div class="font-jp" style="font-size:12px;margin-top:4px;color:var(--gray);">社会</div>
          </button>
        </div>
      </div>

      <!-- Zukan Button -->
      <button class="ut-btn" onclick="showZukan()" style="width:100%;justify-content:center;padding:12px;margin-bottom:16px;font-size:12px;">
        &#128214; ZUKAN &#12316; ずかん &#12316;
      </button>

      <!-- Save Info -->
      <div id="savedStatus" class="ut-box" style="text-align:left;font-size:13px;">
        <span class="font-jp" style="color:var(--gray);">データ ロードちゅう...</span>
      </div>

      <p class="font-pixel" style="font-size:7px; color:var(--dark-gray); margin-top:20px;">
        PRESS A SUBJECT TO START
      </p>
    </div>
  </div>

  <!-- ===== BATTLE SCREEN ===== -->
  <div id="battleScreen" class="screen" style="position:relative;z-index:1;">
    <!-- Top Status -->
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; padding:0 4px;">
      <div class="font-pixel" style="font-size:8px;">
        <span style="color:var(--yellow);">LV <span id="playerLevel">1</span></span>
      </div>
      <div class="font-pixel" style="font-size:8px; color:var(--gray);">
        STAGE <span id="stageNum" style="color:var(--white);">1</span>
      </div>
      <div id="comboDisplay" class="font-pixel" style="font-size:8px; color:var(--gray);">
        <span id="comboCount">0</span> COMBO
      </div>
    </div>

    <!-- EXP Bar -->
    <div style="display:flex;align-items:center;gap:6px;margin-bottom:12px;padding:0 4px;">
      <span class="font-pixel" style="font-size:7px;color:var(--yellow);">EXP</span>
      <div class="exp-bar-bg" style="flex:1;">
        <div id="expBar" class="exp-bar-fill" style="width:0%"></div>
      </div>
    </div>

    <!-- Battle Field -->
    <div id="battleField" class="ut-box" style="margin-bottom:0; border-bottom:none; padding-bottom:0;">
      <!-- Enemy HP -->
      <div style="margin-bottom:12px;">
        <div class="hp-container">
          <span id="enemyName" class="hp-label" style="color:var(--white);min-width:100px;"></span>
          <div class="hp-bar-bg" style="flex:1;">
            <div id="enemyHpBar" class="hp-bar-fill" style="width:100%"></div>
          </div>
          <span id="enemyHpText" class="hp-num"></span>
        </div>
      </div>

      <!-- Monster -->
      <div class="monster-area">
        <div id="enemySprite" class="monster-sprite">&#128126;</div>
      </div>
    </div>

    <!-- Player HP -->
    <div id="playerHpBox" class="ut-box" style="border-top:none; padding-top:12px; padding-bottom:12px; margin-bottom:0;">
      <div class="hp-container">
        <svg class="soul-heart" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
        <span class="hp-label" style="color:var(--white);">きみ</span>
        <span class="hp-label">HP</span>
        <div class="hp-bar-bg" style="flex:1;max-width:160px;">
          <div id="playerHpBar" class="hp-bar-fill" style="width:100%"></div>
        </div>
        <span id="playerHpText" class="hp-num"></span>
        <span class="font-pixel" style="font-size:8px;color:var(--gray);margin-left:8px;">ATK <span id="playerAtkText">15</span></span>
      </div>
    </div>

    <!-- Text Box / Message -->
    <div id="messageBox" class="text-box" style="border-top: none; margin-bottom:0;">
      <span class="asterisk">*</span>
      <span id="messageText">てきが あらわれた!</span>
    </div>

    <!-- Question Area -->
    <div id="questionArea" class="ut-box" style="border-top:none; padding-top:16px;">
      <p id="questionText" class="font-jp" style="font-size:16px; text-align:center; margin-bottom:20px; line-height:1.8; color:var(--yellow);"></p>
      <div id="choicesArea" style="display:grid; grid-template-columns:1fr 1fr; gap:4px;">
      </div>
    </div>

    <!-- Bottom Nav -->
    <div style="display:flex; justify-content:space-between; align-items:center; margin-top:12px; padding:0 4px;">
      <button class="ut-btn" onclick="goTitle()">&#9664; BACK</button>
      <div class="font-pixel" style="font-size:8px; color:var(--gray);">
        DEFEATED: <span id="totalDefeated" style="color:var(--yellow);">0</span>
      </div>
    </div>
  </div>

  <!-- ===== LEVEL UP OVERLAY ===== -->
  <div id="levelUpScreen" class="screen overlay">
    <div class="overlay-content fade-in">
      <svg class="soul-heart-large" viewBox="0 0 24 24" style="display:block;margin:0 auto 20px;">
        <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
      </svg>
      <h2 class="font-pixel" style="font-size:18px; color:var(--yellow); margin-bottom:12px;">LEVEL UP!</h2>
      <p class="font-pixel" style="font-size:12px; margin-bottom:4px;">LV <span id="newLevel">2</span></p>
      <p id="levelUpBonus" class="font-jp" style="font-size:14px; color:var(--yellow); margin-bottom:24px; line-height:1.8;"></p>
      <button class="ut-btn" onclick="closeLevelUp()" style="font-size:12px;padding:8px 24px;">
        <svg class="soul-heart" viewBox="0 0 24 24" style="width:14px;height:14px;"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
        OK
      </button>
    </div>
  </div>

  <!-- ===== VICTORY OVERLAY ===== -->
  <div id="victoryScreen" class="screen overlay">
    <div class="overlay-content fade-in">
      <p id="victoryTitle" class="font-pixel" style="font-size:14px; color:var(--yellow); margin-bottom:8px;">* YOU WON!</p>
      <p id="victoryMsg" class="font-jp" style="font-size:16px; color:var(--white); margin-bottom:8px; line-height:1.8;"></p>
      <p class="font-pixel" style="font-size:10px; color:var(--yellow); margin-bottom:24px;">
        +<span id="expGained">10</span> EXP
      </p>
      <button class="ut-btn" onclick="nextBattle()" style="font-size:12px;padding:8px 24px;">

<script>
// ===================================================================
// CHIPTUNE MUSIC ENGINE (Web Audio API) - DQ-Style Epic BGM
// ===================================================================
class ChiptunePlayer {
  constructor() {
    this.ctx = null;
    this.playing = false;
    this.nodes = [];
    this.nextNoteTime = 0;
    this.currentNote = 0;
    this.timerID = null;
    this.tempo = 165;
    this.gainNode = null;
    this.currentBGM = 'battle'; // 'battle' or 'boss'
  }

  init() {
    if (this.ctx) return;
    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    this.gainNode = this.ctx.createGain();
    this.gainNode.gain.value = 0.15;
    this.gainNode.connect(this.ctx.destination);
  }

  // DQ-style heroic battle melody - Major key, triumphant ascending
  getMelody() {
    const C4=261.63,D4=293.66,E4=329.63,F4=349.23,G4=392,A4=440,B4=493.88;
    const C5=523.25,D5=587.33,E5=659.25,F5=698.46,G5=784,A5=880;
    const R=0;
    return [
      // Heroic opening - bold ascending phrase
      [G4,2],[A4,1],[B4,1],[D5,2],[C5,1],[B4,1],[A4,2],[G4,2],
      [E4,2],[G4,1],[A4,1],[B4,3],[A4,1],[G4,2],[R,2],
      // Triumphant continuation
      [C5,2],[B4,1],[C5,1],[D5,2],[E5,2],[D5,2],[C5,1],[B4,1],
      [A4,2],[B4,1],[C5,1],[D5,3],[R,1],[D5,2],[R,2],
      // Soaring bridge
      [E5,2],[D5,1],[E5,1],[G5,2],[E5,2],[D5,2],[C5,1],[D5,1],
      [E5,2],[C5,2],[B4,2],[A4,1],[G4,1],[A4,4],
      // Resolution with fanfare feel
      [B4,2],[C5,1],[D5,1],[E5,2],[D5,2],[C5,2],[B4,2],
      [G4,2],[A4,2],[B4,2],[C5,2],[D5,4],[R,4],
    ];
  }

  // Strong bass with octave jumps
  getBass() {
    const C3=130.81,D3=146.83,E3=164.81,F3=174.61,G3=196,A3=220,B3=246.94;
    const C4=261.63,D4=293.66,E4=329.63,G4=392;
    const R=0;
    return [
      [G3,2],[G4,2],[G3,2],[G4,2],[A3,2],[A3,2],[G3,2],[G3,2],
      [E3,2],[E3,2],[G3,2],[G3,2],[B3,2],[B3,2],[R,2],[G3,2],
      [C4,2],[C3,2],[C4,2],[C3,2],[E3,2],[E3,2],[D3,2],[D3,2],
      [A3,2],[A3,2],[D3,2],[D3,2],[D4,2],[D3,2],[D4,2],[R,2],
      [E3,2],[E4,2],[E3,2],[E4,2],[C3,2],[C4,2],[D3,2],[D4,2],
      [E3,2],[C3,2],[B3,2],[A3,2],[G3,2],[A3,2],[A3,2],[A3,2],
      [B3,2],[B3,2],[E3,2],[E4,2],[C3,2],[C4,2],[B3,2],[B3,2],
      [G3,2],[A3,2],[B3,2],[C4,2],[G3,4],[R,4],
    ];
  }

  // Harmony (3rd/5th above melody)
  getHarmony() {
    const C4=261.63,D4=293.66,E4=329.63,F4=349.23,G4=392,A4=440,B4=493.88;
    const C5=523.25,D5=587.33,E5=659.25,G5=784;
    const R=0;
    return [
      [B4,2],[C5,1],[D5,1],[G5,2],[E5,1],[D5,1],[C5,2],[B4,2],
      [G4,2],[B4,1],[C5,1],[D5,3],[C5,1],[B4,2],[R,2],
      [E5,2],[D5,1],[E5,1],[G5,2],[G5,2],[G5,2],[E5,1],[D5,1],
      [C5,2],[D5,1],[E5,1],[G5,3],[R,1],[G5,2],[R,2],
      [G5,2],[G5,1],[G5,1],[B4,2],[G5,2],[G5,2],[E5,1],[G5,1],
      [G5,2],[E5,2],[D5,2],[C5,1],[B4,1],[C5,4],
      [D5,2],[E5,1],[G5,1],[G5,2],[G5,2],[E5,2],[D5,2],
      [B4,2],[C5,2],[D5,2],[E5,2],[G5,4],[R,4],
    ];
  }

  // Drum pattern using noise
  getDrumPattern() {
    // [type, duration] type: 'kick', 'hihat', 'rest'
    return [
      ['kick',2],['hihat',2],['kick',2],['hihat',2],
      ['kick',2],['hihat',2],['kick',2],['hihat',2],
    ];
  }

  // Boss BGM - Minor key, intense, faster
  getBossMelody() {
    const C4=261.63,Db4=277.18,D4=293.66,Eb4=311.13,E4=329.63,F4=349.23,Gb4=369.99,G4=392,Ab4=415.30,A4=440,Bb4=466.16,B4=493.88;
    const C5=523.25,Db5=554.37,D5=587.33,Eb5=622.25,E5=659.25,F5=698.46,G5=784;
    const R=0;
    return [
      // Ominous, driving opening
      [E4,1],[E4,1],[E4,1],[R,1],[E4,1],[R,1],[G4,1],[E4,1],
      [C4,1],[E4,1],[G4,2],[Ab4,2],[G4,1],[E4,1],
      [A4,2],[A4,1],[R,1],[A4,1],[G4,1],[F4,1],[E4,1],
      [E4,2],[G4,2],[B4,2],[C5,1],[B4,1],
      // Tension build
      [C5,1],[C5,1],[C5,1],[R,1],[C5,1],[R,1],[D5,1],[C5,1],
      [B4,1],[C5,1],[E5,2],[Eb5,2],[D5,1],[C5,1],
      [D5,2],[C5,1],[B4,1],[A4,1],[B4,1],[C5,1],[D5,1],
      [E5,2],[D5,2],[C5,2],[B4,1],[R,1],
      // Dark resolution
      [E5,1],[E5,1],[D5,1],[C5,1],[B4,1],[A4,1],[G4,1],[R,1],
      [A4,2],[G4,1],[F4,1],[E4,2],[R,2],
      [E4,1],[G4,1],[B4,1],[E5,1],[D5,1],[C5,1],[B4,1],[A4,1],
      [E4,4],[R,4],
    ];
  }

  getBossBass() {
    const A2=110,B2=123.47,C3=130.81,D3=146.83,E3=164.81,F3=174.61,G3=196,Ab3=207.65,A3=220,B3=246.94;
    const C4=261.63,E4=329.63;
    const R=0;
    return [
      [E3,1],[E3,1],[E4,1],[E3,1],[E3,1],[E4,1],[E3,1],[E3,1],
      [C3,1],[C3,1],[C3,2],[Ab3,2],[G3,1],[E3,1],
      [A2,2],[A3,1],[A2,1],[A3,1],[G3,1],[F3,1],[E3,1],
      [E3,2],[E3,2],[B2,2],[C3,1],[B2,1],
      [C3,1],[C3,1],[C4,1],[C3,1],[C3,1],[C4,1],[D3,1],[C3,1],
      [B2,1],[C3,1],[E3,2],[E3,2],[D3,1],[C3,1],
      [D3,2],[C3,1],[B2,1],[A2,1],[B2,1],[C3,1],[D3,1],
      [E3,2],[D3,2],[C3,2],[B2,1],[R,1],
      [E3,1],[E3,1],[D3,1],[C3,1],[B2,1],[A2,1],[G3,1],[R,1],
      [A2,2],[G3,1],[F3,1],[E3,2],[R,2],
      [E3,1],[E3,1],[B2,1],[E3,1],[D3,1],[C3,1],[B2,1],[A2,1],
      [E3,4],[R,4],
    ];
  }

  getBossHarmony() {
    const C4=261.63,D4=293.66,E4=329.63,F4=349.23,G4=392,Ab4=415.30,A4=440,B4=493.88;
    const C5=523.25,D5=587.33,E5=659.25;
    const R=0;
    return [
      [G4,1],[G4,1],[G4,1],[R,1],[G4,1],[R,1],[B4,1],[G4,1],
      [E4,1],[G4,1],[B4,2],[C5,2],[B4,1],[G4,1],
      [C5,2],[C5,1],[R,1],[C5,1],[B4,1],[A4,1],[G4,1],
      [G4,2],[B4,2],[D5,2],[E5,1],[D5,1],
      [E5,1],[E5,1],[E5,1],[R,1],[E5,1],[R,1],[G4,1],[E5,1],
      [D5,1],[E5,1],[G4,2],[G4,2],[G4,1],[E4,1],
      [G4,2],[E4,1],[D4,1],[C4,1],[D4,1],[E4,1],[G4,1],
      [G4,2],[G4,2],[E4,2],[D4,1],[R,1],
      [G4,1],[G4,1],[G4,1],[E4,1],[D4,1],[C4,1],[B4,1],[R,1],
      [C5,2],[B4,1],[A4,1],[G4,2],[R,2],
      [G4,1],[B4,1],[D5,1],[G4,1],[G4,1],[E4,1],[D4,1],[C4,1],
      [G4,4],[R,4],
    ];
  }

  playSquare(freq, startTime, duration, type='square') {
    if (!this.ctx || freq === 0) return;
    const osc = this.ctx.createOscillator();
    const env = this.ctx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    env.gain.setValueAtTime(0.3, startTime);
    env.gain.exponentialRampToValueAtTime(0.01, startTime + duration * 0.9);
    osc.connect(env);
    env.connect(this.gainNode);
    osc.start(startTime);
    osc.stop(startTime + duration);
  }

  playDrum(type, startTime, duration) {
    if (!this.ctx) return;
    if (type === 'kick') {
      const osc = this.ctx.createOscillator();
      const env = this.ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(150, startTime);
      osc.frequency.exponentialRampToValueAtTime(40, startTime + 0.08);
      env.gain.setValueAtTime(0.4, startTime);
      env.gain.exponentialRampToValueAtTime(0.01, startTime + 0.1);
      osc.connect(env);
      env.connect(this.gainNode);
      osc.start(startTime);
      osc.stop(startTime + 0.12);
    } else if (type === 'hihat') {
      const bufferSize = this.ctx.sampleRate * 0.05;
      const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
      const noise = this.ctx.createBufferSource();
      noise.buffer = buffer;
      const filter = this.ctx.createBiquadFilter();
      filter.type = 'highpass';
      filter.frequency.value = 8000;
      const env = this.ctx.createGain();
      env.gain.setValueAtTime(0.1, startTime);
      env.gain.exponentialRampToValueAtTime(0.001, startTime + 0.04);
      noise.connect(filter);
      filter.connect(env);
      env.connect(this.gainNode);
      noise.start(startTime);
      noise.stop(startTime + 0.05);
    }
  }

  playBattleBGM() {
    this.currentBGM = 'battle';
    this.tempo = 165;
    this.restart();
  }

  playBossBGM() {
    this.currentBGM = 'boss';
    this.tempo = 180;
    this.restart();
  }

  restart() {
    this.stop();
    this.start();
  }

  start() {
    this.init();
    if (this.ctx.state === 'suspended') this.ctx.resume();
    this.playing = true;
    this.currentNote = 0;
    this.nextNoteTime = this.ctx.currentTime + 0.1;
    this.schedule();
  }

  schedule() {
    if (!this.playing) return;
    const isBoss = this.currentBGM === 'boss';
    const melody = isBoss ? this.getBossMelody() : this.getMelody();
    const bass = isBoss ? this.getBossBass() : this.getBass();
    const harmony = isBoss ? this.getBossHarmony() : this.getHarmony();
    const drums = this.getDrumPattern();
    const secPer16th = 60 / this.tempo / 4;

    while (this.nextNoteTime < this.ctx.currentTime + 0.2) {
      const mIdx = this.currentNote % melody.length;
      const bIdx = this.currentNote % bass.length;
      const hIdx = this.currentNote % harmony.length;
      const dIdx = this.currentNote % drums.length;

      const [mFreq, mDur] = melody[mIdx];
      const [bFreq, bDur] = bass[bIdx];
      const [hFreq, hDur] = harmony[hIdx];
      const [dType, dDur] = drums[dIdx];

      // Melody - square wave
      this.playSquare(mFreq, this.nextNoteTime, mDur * secPer16th * 0.9, 'square');
      // Bass - triangle wave
      this.playSquare(bFreq, this.nextNoteTime, bDur * secPer16th * 0.8, 'triangle');
      // Harmony - triangle wave (quieter)
      if (hFreq > 0) {
        const osc = this.ctx.createOscillator();
        const env = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.value = hFreq;
        env.gain.setValueAtTime(0.12, this.nextNoteTime);
        env.gain.exponentialRampToValueAtTime(0.01, this.nextNoteTime + hDur * secPer16th * 0.7);
        osc.connect(env);
        env.connect(this.gainNode);
        osc.start(this.nextNoteTime);
        osc.stop(this.nextNoteTime + hDur * secPer16th);
      }
      // Drums
      if (dType !== 'rest') {
        this.playDrum(dType, this.nextNoteTime, dDur * secPer16th);
      }

      this.nextNoteTime += mDur * secPer16th;
      this.currentNote++;
    }
    this.timerID = setTimeout(() => this.schedule(), 50);
  }

  stop() {
    this.playing = false;
    if (this.timerID) clearTimeout(this.timerID);
  }

  // SFX
  playSfx(type) {
    this.init();
    if (this.ctx.state === 'suspended') this.ctx.resume();
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    gain.gain.value = 0.2;
    osc.connect(gain);
    gain.connect(this.ctx.destination);

    if (type === 'correct') {
      osc.type = 'square';
      osc.frequency.setValueAtTime(523, now);
      osc.frequency.setValueAtTime(659, now + 0.08);
      osc.frequency.setValueAtTime(784, now + 0.16);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
      osc.start(now); osc.stop(now + 0.3);
    } else if (type === 'wrong') {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(200, now);
      osc.frequency.exponentialRampToValueAtTime(100, now + 0.3);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
      osc.start(now); osc.stop(now + 0.35);
    } else if (type === 'victory') {
      osc.type = 'square';
      [523,587,659,784].forEach((f,i) => {
        osc.frequency.setValueAtTime(f, now + i * 0.12);
      });
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.6);
      osc.start(now); osc.stop(now + 0.6);
    } else if (type === 'bossClear') {
      // Epic boss clear fanfare
      osc.type = 'square';
      const fanfare = [523,587,659,784,880,784,880,1047];
      fanfare.forEach((f,i) => {
        osc.frequency.setValueAtTime(f, now + i * 0.15);
      });
      gain.gain.setValueAtTime(0.25, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 1.4);
      osc.start(now); osc.stop(now + 1.4);
      // Add a second harmony osc
      const osc2 = this.ctx.createOscillator();
      const gain2 = this.ctx.createGain();
      osc2.type = 'triangle';
      gain2.gain.value = 0.15;
      osc2.connect(gain2);
      gain2.connect(this.ctx.destination);
      const harm = [392,440,494,523,659,523,659,784];
      harm.forEach((f,i) => {
        osc2.frequency.setValueAtTime(f, now + i * 0.15);
      });
      gain2.gain.exponentialRampToValueAtTime(0.01, now + 1.4);
      osc2.start(now); osc2.stop(now + 1.4);
    } else if (type === 'levelup') {
      osc.type = 'square';
      [392,440,494,523,587,659,784,880].forEach((f,i) => {
        osc.frequency.setValueAtTime(f, now + i * 0.08);
      });
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.8);
      osc.start(now); osc.stop(now + 0.8);
    } else if (type === 'select') {
      osc.type = 'square';
      osc.frequency.value = 600;
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.06);
      osc.start(now); osc.stop(now + 0.08);
    } else if (type === 'gameover') {
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(440, now);
      osc.frequency.exponentialRampToValueAtTime(110, now + 0.8);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 1);
      osc.start(now); osc.stop(now + 1);
    } else if (type === 'bossAppear') {
      // Dramatic boss entrance sound
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(80, now);
      osc.frequency.exponentialRampToValueAtTime(200, now + 0.3);
      osc.frequency.setValueAtTime(80, now + 0.35);
      osc.frequency.exponentialRampToValueAtTime(300, now + 0.7);
      gain.gain.setValueAtTime(0.3, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.9);
      osc.start(now); osc.stop(now + 0.9);
    }
  }
}

const music = new ChiptunePlayer();
let musicOn = false;

function toggleMusic() {
  const btn = document.getElementById('musicToggle');
  if (!musicOn) {
    music.start();
    musicOn = true;
    btn.textContent = '\u266B ON';
    btn.classList.add('on');
  } else {
    music.stop();
    musicOn = false;
    btn.textContent = '\u266B OFF';
    btn.classList.remove('on');
  }
}

function createStars() {
  const container = document.getElementById('stars');
  for (let i = 0; i < 60; i++) {
    const star = document.createElement('div');
    star.className = 'star';
    const size = Math.random() * 2 + 1;
    star.style.cssText = `
      width:${size}px; height:${size}px;
      left:${Math.random()*100}%; top:${Math.random()*100}%;
      animation-delay:${Math.random()*3}s;
      animation-duration:${2 + Math.random()*3}s;
    `;
    container.appendChild(star);
  }
}

  // Ensure all monsters and bosses exist in the book

      state.monsterBook[e.name] = { emoji: e.emoji, defeated: false, count: 0, isBoss: false };

  bosses.forEach(b => {

  });

function recordDefeatedMonster(name, emoji, isBoss) {
  if (!state.monsterBook[name]) {
    state.monsterBook[name] = { emoji, defeated: true, count: 1, isBoss: !!isBoss };
  } else {
    state.monsterBook[name].defeated = true;
    state.monsterBook[name].count++;
  }
}

// ===================================================================
// SAVE / LOAD
// ===================================================================
function saveGame() {
  localStorage.setItem('studyquest_save', JSON.stringify({
    playerLevel: state.playerLevel, playerExp: state.playerExp,
    playerMaxHp: state.playerMaxHp, playerAtk: state.playerAtk,
    totalDefeated: state.totalDefeated, maxCombo: state.maxCombo,
    monsterBook: state.monsterBook,
  }));
}

function loadGame() {
  const raw = localStorage.getItem('studyquest_save');
  if (raw) {
    const s = JSON.parse(raw);
    Object.assign(state, {
      playerLevel: s.playerLevel||1, playerExp: s.playerExp||0,
      playerMaxHp: s.playerMaxHp||100, playerAtk: s.playerAtk||15,
      totalDefeated: s.totalDefeated||0, maxCombo: s.maxCombo||0,
    });
    if (s.monsterBook) {
      state.monsterBook = s.monsterBook;
    }
    updateExpToNext();
  }
  initMonsterBook();
  updateSavedStatus();
}

function updateSavedStatus() {
  document.getElementById('savedStatus').innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;">
      <span class="font-jp">
        <svg class="soul-heart" viewBox="0 0 24 24" style="width:12px;height:12px;vertical-align:middle;margin-right:4px;"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
        LV ${state.playerLevel} のゆうしゃ
      </span>
      <span class="font-pixel" style="font-size:8px;color:var(--yellow);">${state.totalDefeated} DEFEATED</span>
    </div>
    <div style="display:flex;justify-content:space-between;margin-top:6px;">
      <span class="font-pixel" style="font-size:7px;color:var(--gray);">MAX COMBO: ${state.maxCombo}</span>
      <span class="font-pixel" style="font-size:7px;color:var(--gray);">ATK: ${state.playerAtk}</span>
    </div>
  `;
}

function updateExpToNext() { state.expToNext = 30 + (state.playerLevel - 1) * 15; }

// ===================================================================
// SCREEN MANAGEMENT
// ===================================================================
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function goTitle() {
  saveGame();
  if (musicOn && music.currentBGM !== 'battle') {
    music.playBattleBGM();
  }
  showScreen('titleScreen');
  updateSavedStatus();
}

// ===================================================================
// MONSTER BOOK (ZUKAN) SCREEN
// ===================================================================
function showZukan() {
  music.playSfx('select');
  initMonsterBook();

  const allMonsters = Object.keys(state.monsterBook);
  const defeated = allMonsters.filter(k => state.monsterBook[k].defeated);
  const pct = allMonsters.length > 0 ? Math.floor((defeated.length / allMonsters.length) * 100) : 0;

  document.getElementById('zukanCompletion').textContent =
    `COMPLETION: ${defeated.length}/${allMonsters.length} (${pct}%)`;

  const grid = document.getElementById('zukanGrid');
  // Show regular enemies first, then bosses
  const orderedNames = [];
  enemies.forEach(e => { if (!orderedNames.includes(e.name)) orderedNames.push(e.name); });
  bosses.forEach(b => { if (!orderedNames.includes(b.name)) orderedNames.push(b.name); });
  // Add any others that might be in monsterBook but not in arrays
  allMonsters.forEach(n => { if (!orderedNames.includes(n)) orderedNames.push(n); });

  grid.innerHTML = orderedNames.map(name => {
    const m = state.monsterBook[name];
    const isDefeated = m && m.defeated;
    const isBoss = m && m.isBoss;
    const cardClass = isDefeated ? (isBoss ? 'zukan-card defeated boss-card' : 'zukan-card defeated') : 'zukan-card';
    const emojiClass = isDefeated ? 'zukan-emoji' : 'zukan-emoji unknown';
    const displayName = isDefeated ? name : '???';
    const countText = isDefeated ? `x${m.count}` : '';

    return `
      <div class="${cardClass}">
        <span class="${emojiClass}">${m ? m.emoji : '?'}</span>
        <div class="zukan-name">${displayName}</div>
        ${countText ? `<div class="zukan-count">${countText}</div>` : ''}
        ${isBoss && isDefeated ? '<div class="font-pixel" style="font-size:5px;color:var(--orange);margin-top:1px;">BOSS</div>' : ''}
      </div>
    `;
  }).join('');

  showScreen('monsterBookScreen');
}

// ===================================================================
// GAME START
// ===================================================================
function startGame(subject) {
  music.playSfx('select');
  state.subject = subject;
  state.playerHp = state.playerMaxHp;
  state.combo = 0;
  state.stage = 1;
  state.usedQuestions = [];
  state.isBossBattle = false;
  spawnEnemy();
  showScreen('battleScreen');
  updateBattleUI();
  showNextQuestion();
  // Ensure battle BGM
  if (musicOn && music.currentBGM !== 'battle') {
    music.playBattleBGM();
  }
}

function spawnEnemy() {
  // Check for boss stage (every 5th)
  if (state.stage % 5 === 0) {
    const bossIdx = bosses.findIndex(b => b.stage === state.stage);
    if (bossIdx !== -1) {
      spawnBoss(bosses[bossIdx]);
      return;
    }
    // If no matching boss defined, use last boss scaled
    const lastBoss = bosses[bosses.length - 1];
    const scale = 1 + (state.stage - lastBoss.stage) * 0.15;
    const scaledBoss = {
      ...lastBoss,
      hp: Math.floor(lastBoss.hp * scale),
      atk: Math.floor(lastBoss.atk * scale),
      exp: Math.floor(lastBoss.exp * scale),
      message: `* ${lastBoss.name} が ふたたび あらわれた!\n  さらに つよくなっている!`
    };
    spawnBoss(scaledBoss);
    return;
  }

  state.isBossBattle = false;
  removeBossStyle();
  const idx = Math.min(state.stage - 1, enemies.length - 1);
  const base = enemies[idx % enemies.length];
  const scale = 1 + (state.stage - 1) * 0.1;
  state.enemy = { ...base };
  state.enemyHp = Math.floor(base.hp * scale);
  state.enemyMaxHp = state.enemyHp;
}

function spawnBoss(boss) {
  state.isBossBattle = true;
  state.enemy = { ...boss, isBoss: true };
  const scale = 1 + Math.floor(state.stage / 20) * 0.3;
  state.enemyHp = Math.floor(boss.hp * scale);
  state.enemyMaxHp = state.enemyHp;

  // Boss entrance animation
  applyBossStyle();
  showBossEntrance(boss);

  // Switch to boss BGM
  if (musicOn) {
    music.playBossBGM();
  }
}

function applyBossStyle() {
  document.getElementById('battleField').classList.add('boss-battle');
  document.getElementById('playerHpBox').classList.add('boss-battle');
  document.getElementById('messageBox').classList.add('boss-battle');
  document.getElementById('questionArea').classList.add('boss-battle');
}

function removeBossStyle() {
  document.getElementById('battleField').classList.remove('boss-battle');
  document.getElementById('playerHpBox').classList.remove('boss-battle');
  document.getElementById('messageBox').classList.remove('boss-battle');
  document.getElementById('questionArea').classList.remove('boss-battle');
  // Restore normal BGM if needed
  if (musicOn && music.currentBGM === 'boss') {
    music.playBattleBGM();
  }
}

function showBossEntrance(boss) {
  // Screen flash
  const flash = document.createElement('div');
  flash.className = 'boss-flash-overlay';
  document.body.appendChild(flash);
  setTimeout(() => flash.remove(), 700);

  // Play boss appear SFX
  music.playSfx('bossAppear');

  // Boss sprite entrance animation
  const sprite = document.getElementById('enemySprite');
  sprite.classList.remove('float-bounce');
  sprite.classList.add('boss-sprite', 'boss-entrance');
  setTimeout(() => {
    sprite.classList.remove('boss-entrance');
    sprite.classList.add('boss-float');
  }, 800);
}

// ===================================================================
// UI UPDATE
// ===================================================================
function updateBattleUI() {
  document.getElementById('playerLevel').textContent = state.playerLevel;
  document.getElementById('stageNum').textContent = state.stage;
  document.getElementById('comboCount').textContent = state.combo;
  document.getElementById('totalDefeated').textContent = state.totalDefeated;
  document.getElementById('playerAtkText').textContent = state.playerAtk;

  const pPct = Math.max(0, (state.playerHp / state.playerMaxHp) * 100);
  document.getElementById('playerHpBar').style.width = pPct + '%';
  document.getElementById('playerHpText').textContent = `${Math.max(0,state.playerHp)} / ${state.playerMaxHp}`;

  const ePct = Math.max(0, (state.enemyHp / state.enemyMaxHp) * 100);
  document.getElementById('enemyHpBar').style.width = ePct + '%';
  document.getElementById('enemyHpText').textContent = `${Math.max(0,state.enemyHp)} / ${state.enemyMaxHp}`;
  document.getElementById('enemyName').textContent = state.enemy.name;
  document.getElementById('enemySprite').textContent = state.enemy.emoji;

  // Boss sprite size
  const sprite = document.getElementById('enemySprite');
  if (state.isBossBattle) {
    sprite.classList.add('boss-sprite');
  } else {
    sprite.classList.remove('boss-sprite', 'boss-float');
  }

  const expPct = (state.playerExp / state.expToNext) * 100;
  document.getElementById('expBar').style.width = Math.min(100, expPct) + '%';

  // Combo color
  const cd = document.getElementById('comboDisplay');
  if (state.combo >= 5) cd.style.color = 'var(--yellow)';
  else if (state.combo >= 3) cd.style.color = 'var(--orange)';
  else cd.style.color = 'var(--gray)';
}

// ===================================================================
// QUESTIONS
// ===================================================================
function showNextQuestion() {
  const pool = questions[state.subject];
  let avail = pool.filter((_, i) => !state.usedQuestions.includes(i));
  if (avail.length === 0) { state.usedQuestions = []; avail = pool; }
  const qi = pool.indexOf(avail[Math.floor(Math.random() * avail.length)]);
  state.usedQuestions.push(qi);
  const q = pool[qi];

  document.getElementById('questionText').innerText = q.q;

  const area = document.getElementById('choicesArea');
  area.innerHTML = q.c.map((c, i) => `
    <button class="choice-btn" onclick="selectAnswer(${qi}, ${i})" ${state.isAnimating ? 'disabled' : ''}>
      <svg class="choice-soul" viewBox="0 0 24 24" width="14" height="14">
        <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
      </svg>
      ${c}
    </button>
  `).join('');

  // Show boss message or normal message
  if (state.isBossBattle && state.enemy.message && state.enemyHp === state.enemyMaxHp) {
    setMessage(state.enemy.message);
  } else {
    setMessage(state.enemy.name + " が あらわれた!");
  }
}

function setMessage(text) {
  document.getElementById('messageText').textContent = text;
}

// ===================================================================
// ANSWER HANDLING
// ===================================================================
function selectAnswer(qIdx, choiceIdx) {
  if (state.isAnimating) return;
  state.isAnimating = true;
  music.playSfx('select');

  const q = questions[state.subject][qIdx];
  if (choiceIdx === q.a) handleCorrect();
  else handleWrong(q.c[q.a]);
}

function handleCorrect() {
  state.combo++;
  if (state.combo > state.maxCombo) state.maxCombo = state.combo;

  const mult = 1 + (state.combo - 1) * 0.15;
  const dmg = Math.floor(state.playerAtk * mult);

  music.playSfx('correct');

  let msg = `* せいかい! ${dmg} ダメージ!`;
  if (state.combo >= 5) msg += ` ${state.combo} COMBO!!`;
  else if (state.combo >= 3) msg += ` ${state.combo} COMBO!`;
  setMessage(msg);

  // Hit animation
  const sprite = document.getElementById('enemySprite');
  sprite.classList.remove('float-bounce', 'boss-float');
  sprite.classList.add('hit-flash');
  showDamageNumber(dmg);

  state.enemyHp -= dmg;
  updateBattleUI();

  setTimeout(() => {
    sprite.classList.remove('hit-flash');
    if (state.isBossBattle) sprite.classList.add('boss-float');
    else sprite.classList.add('float-bounce');
    if (state.enemyHp <= 0) handleVictory();
    else { state.isAnimating = false; showNextQuestion(); }
  }, 500);
}

function handleWrong(correct) {
  state.combo = 0;
  const dmg = state.enemy.atk;

  music.playSfx('wrong');
  setMessage(`* はずれ... 正解: ${correct}  -${dmg} HP`);

  document.getElementById('battleField').classList.add('shake');
  state.playerHp -= dmg;
  updateBattleUI();

  setTimeout(() => {
    document.getElementById('battleField').classList.remove('shake');
    if (state.playerHp <= 0) handleGameOver();
    else { state.isAnimating = false; showNextQuestion(); }
  }, 500);
}

function showDamageNumber(dmg) {
  const area = document.querySelector('.monster-area');
  const el = document.createElement('div');
  el.className = 'damage-number damage-float';
  el.textContent = '-' + dmg;
  el.style.left = '50%';
  el.style.top = '20%';
  el.style.transform = 'translateX(-50%)';
  area.appendChild(el);
  setTimeout(() => el.remove(), 1000);
}

// ===================================================================
// VICTORY
// ===================================================================
function handleVictory() {
  state.totalDefeated++;
  const isBoss = state.isBossBattle;
  const expMultiplier = isBoss ? 3 : 1;
  const expGain = (state.enemy.exp + Math.floor(state.combo * 2)) * expMultiplier;
  state.playerExp += expGain;

  // Record to monster book
  recordDefeatedMonster(state.enemy.name, state.enemy.emoji, isBoss);

  if (isBoss) {
    music.playSfx('bossClear');
  } else {
    music.playSfx('victory');
  }

  // Set victory screen content
  const victoryTitle = document.getElementById('victoryTitle');
  if (isBoss) {
    victoryTitle.innerHTML = '<span class="boss-victory-pulse" style="display:inline-block;">&#x2B50; BOSS DEFEATED! &#x2B50;</span>';
    victoryTitle.style.color = 'var(--orange)';
    victoryTitle.style.fontSize = '16px';
  } else {
    victoryTitle.textContent = '* YOU WON!';
    victoryTitle.style.color = 'var(--yellow)';
    victoryTitle.style.fontSize = '14px';
  }

  document.getElementById('victoryMsg').textContent = `* ${state.enemy.name} を たおした!`;
  document.getElementById('expGained').textContent = expGain;
  saveGame();

  if (state.playerExp >= state.expToNext) {
    state.playerExp -= state.expToNext;
    state.playerLevel++;
    state.playerMaxHp += 10;
    state.playerAtk += 3;
    state.playerHp = state.playerMaxHp;
    updateExpToNext();
    saveGame();

    document.getElementById('newLevel').textContent = state.playerLevel;
    document.getElementById('levelUpBonus').innerHTML =
      `HP +10 (${state.playerMaxHp})<br>ATK +3 (${state.playerAtk})<br>HP ぜんかいふく!`;

    setTimeout(() => music.playSfx('levelup'), 200);
    showScreen('levelUpScreen');
    state.isAnimating = false;
    return;
  }

  showScreen('victoryScreen');
  state.isAnimating = false;
}

function closeLevelUp() { showScreen('victoryScreen'); }

function nextBattle() {
  music.playSfx('select');
  state.stage++;
  state.playerHp = Math.min(state.playerMaxHp, state.playerHp + Math.floor(state.playerMaxHp * 0.2));
  spawnEnemy();
  showScreen('battleScreen');
  updateBattleUI();
  showNextQuestion();
}

// ===================================================================
// GAME OVER
// ===================================================================
function handleGameOver() {
  music.playSfx('gameover');
  saveGame();
  showScreen('gameOverScreen');
  state.isAnimating = false;
}

function retryBattle() {
  music.playSfx('select');
  state.playerHp = state.playerMaxHp;
  state.combo = 0;
  spawnEnemy();
  showScreen('battleScreen');
  updateBattleUI();
  showNextQuestion();
}

// ===================================================================
// INIT
// ===================================================================
loadGame();
</script>

</html>
