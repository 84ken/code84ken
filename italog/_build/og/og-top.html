<!doctype html>

<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #1d1915; }
  .og { position: relative; width: 1200px; height: 630px; overflow: hidden; font-family: 'Noto Sans JP', sans-serif; }
  .photo {
    position: absolute; left: 0; right: 0; top: 0; height: 534px;
    background:
      linear-gradient(90deg, rgba(20,16,12,.86) 0%, rgba(20,16,12,.62) 40%, rgba(20,16,12,.12) 72%, rgba(20,16,12,0) 100%),
      url(../../assets/img/photos/_dsc1232.jpg) 70% 62% / cover;
  }
  .wind { position: absolute; left: 0; top: 0; width: 1200px; height: 534px; }
  .label {
    position: absolute; left: 64px; top: 58px; display: flex; align-items: center; gap: 14px;
    font-family: Unbounded, sans-serif; font-weight: 500; font-size: 19px; letter-spacing: .16em; color: #eeeae3;
  }
  h1 {
    position: absolute; left: 60px; top: 104px; margin: 0;
    font-family: 'Zen Kaku Gothic Antique', sans-serif; font-weight: 900; font-size: 92px; line-height: 1.1;
    letter-spacing: .02em; color: #fff;
  }
  .meta { position: absolute; left: 64px; top: 442px; display: flex; gap: 30px; color: rgba(255,255,255,.92); font-size: 22px; font-weight: 500; }
  .meta span { display: inline-flex; align-items: center; gap: 10px; }
  .meta span::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: #f3b640; }
  .logo { position: absolute; right: 52px; top: 44px; width: 104px; filter: invert(1); opacity: .95; }
  .band {
    position: absolute; left: 0; right: 0; bottom: 0; height: 96px; background: #e8603f; color: #1d1915;
    display: flex; align-items: center; gap: 26px; padding-left: 36px; white-space: nowrap;
    font-family: Unbounded, sans-serif; font-weight: 700; font-size: 46px; letter-spacing: .01em;
  }
  .sep { position: relative; flex-shrink: 0; width: 28px; height: 28px; border: 3px solid currentColor; border-radius: 50%; }
  .sep::before, .sep::after { content: ""; position: absolute; background: currentColor; }
  .sep::before { left: 50%; top: -9px; width: 3px; height: 46px; transform: translateX(-50%); }
  .sep::after { top: 50%; left: -9px; height: 3px; width: 46px; transform: translateY(-50%); }
</style>
</head>

<div class="og">
