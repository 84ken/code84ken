<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}</style>
<title>うさぎとねこのかけっこ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Yomogi&display=swap">
<style>
:root{
  color-scheme: light;
  --paper:#fcfcf6;
  --rule:#c3d0ea;
  --rule-strong:#8fa6d6;
  --ink:#1f1f26;
  --ink-soft:#6b6f80;
  --pink:#f5b3c1;
  --red:#e2493f;
  --yellow:#f6d34d;
  --sky:#dfe8f8;
}
html,body{height:100%}
body{
  background-color:var(--paper);
  background-image:repeating-linear-gradient(to bottom, transparent 0 33px, var(--rule) 33px 34px);
  color:var(--ink);
  font-family:"Klee One","Yomogi","Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;
  padding-inline:16px;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
  user-select:none; -webkit-user-select:none;
}
.wrap{max-width:720px;margin:0 auto;padding-block:18px 28px;display:flex;flex-direction:column;gap:16px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
h1{font-family:"Yomogi","Klee One",sans-serif;font-weight:400;font-size:clamp(28px,7vw,40px);line-height:1.1;margin:0;text-wrap:balance;letter-spacing:.02em}
h1 .u{background:linear-gradient(transparent 62%, var(--pink) 62%)}
h1 .n{background:linear-gradient(transparent 62%, var(--yellow) 62%)}
.byline{margin:6px 0 0;color:var(--ink-soft);font-size:14px}
.sound{font:inherit;font-size:14px;background:var(--paper);color:var(--ink);border:2px solid var(--ink);border-radius:18px 14px 20px 12px;padding:4px 12px;cursor:pointer}

.opts{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
.group{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.group .lbl{font-size:14px;color:var(--ink-soft);margin-right:2px}
.chip{font:inherit;font-size:16px;padding:6px 14px;background:var(--paper);color:var(--ink);border:2px solid var(--ink);border-radius:16px 20px 14px 22px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.chip:focus-visible,.big:focus-visible,.go:focus-visible,.sound:focus-visible{outline:3px dashed var(--red);outline-offset:3px}

.track{position:relative;border:2.5px solid var(--ink);border-radius:22px 18px 26px 16px;background:var(--paper);overflow:hidden}
.lane{position:relative;height:118px;border-bottom:2px dashed var(--rule-strong)}
.lane:last-child{border-bottom:0}
.lane-name{position:absolute;left:10px;top:6px;font-size:13px;color:var(--ink-soft);z-index:1}
.lane-name b{font-variant-numeric:tabular-nums;color:var(--ink);font-weight:600}
.goal{position:absolute;top:0;bottom:0;right:14px;width:10px;
  background:repeating-linear-gradient(to bottom,var(--ink) 0 10px,var(--paper) 10px 20px);
  border-left:2px solid var(--ink);border-right:2px solid var(--ink);z-index:0}
.goal-flag{position:absolute;right:4px;top:4px;z-index:2;font-family:"Yomogi",sans-serif;font-size:15px;background:var(--red);color:#fff;padding:1px 8px;border-radius:6px 10px 6px 8px}
.runner{position:absolute;left:8px;bottom:4px;width:78px;height:100px;z-index:3;will-change:transform}
.bob{position:relative;width:100%;height:100%}
.runner svg.char{width:100%;height:100%;overflow:visible}
.speed{position:absolute;left:-26px;top:44%;width:26px;height:30px;opacity:0}
.win svg.char{animation:hop .5s ease-in-out infinite alternate}
@keyframes hop{from{transform:translateY(0) rotate(-4deg)}to{transform:translateY(-16px) rotate(4deg)}}

.msg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:5;pointer-events:none;text-align:center;padding:12px}
.msg .big-t{font-family:"Yomogi",sans-serif;font-size:clamp(40px,12vw,72px);line-height:1;background:var(--paper);padding:6px 18px;border:3px solid var(--ink);border-radius:26px 18px 30px 20px;transform:rotate(-3deg)}
.msg .sub-t{margin-top:10px;font-size:18px;background:var(--paper);padding:2px 10px;border-radius:8px;font-variant-numeric:tabular-nums}
.pop{animation:pop .35s ease-out}
@keyframes pop{from{transform:scale(.4) rotate(-10deg);opacity:0}to{transform:scale(1) rotate(-3deg);opacity:1}}

.controls{display:grid;grid-template-columns:1fr;gap:12px}
.controls.duo{grid-template-columns:1fr 1fr}
.big{font:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  min-height:150px;border:3px solid var(--ink);color:var(--ink);cursor:pointer;
  box-shadow:0 6px 0 var(--ink);transition:transform .05s, box-shadow .05s;touch-action:manipulation}
.big.r{background:var(--pink);border-radius:40px 34px 44px 30px}
.big.c{background:var(--yellow);border-radius:34px 44px 30px 40px}
.big:active,.big.pressed{transform:translateY(5px);box-shadow:0 1px 0 var(--ink)}
.big svg{width:64px;height:64px}
.big .t{font-family:"Yomogi",sans-serif;font-size:28px;letter-spacing:.08em}
.big .k{font-size:12px;color:var(--ink-soft)}
.big[disabled]{opacity:.55;cursor:default}
.go{font:inherit;font-family:"Yomogi",sans-serif;font-size:26px;padding:12px 18px;background:var(--ink);color:var(--paper);border:0;border-radius:22px 30px 20px 28px;cursor:pointer;box-shadow:0 5px 0 var(--red)}
.go:active{transform:translateY(4px);box-shadow:0 1px 0 var(--red)}
.hint{margin:0;font-size:14px;color:var(--ink-soft);text-align:center}
@media (prefers-reduced-motion: reduce){ .win svg.char,.pop{animation:none} }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <filter id="wobble"><feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="3"/><feDisplacementMap in="SourceGraphic" scale="2.2"/></filter>
    <symbol id="rabbitFace" viewBox="10 0 80 90">
      <g fill="#fcfcf6" stroke="#1f1f26" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <path d="M40 46 C28 32 26 6 38 4 C50 2 50 30 47 45"/>
        <path d="M54 44 C54 20 66 0 76 6 C86 12 72 34 62 47"/>
        <ellipse cx="50" cy="63" rx="28" ry="22"/>
        <circle cx="40" cy="60" r="5"/><circle cx="40" cy="60" r="2" fill="#1f1f26"/>
        <ellipse cx="60" cy="60" rx="3.2" ry="4.2" fill="#1f1f26"/>
        <path d="M48 67 l2 2 l2 -2 z" fill="#1f1f26"/>
        <path d="M50 69 q-3 5 -8 2 M50 69 q3 5 8 2" fill="none"/>
      </g>
      <circle cx="31" cy="70" r="4" fill="#f5b3c1"/><circle cx="69" cy="70" r="4" fill="#f5b3c1"/>
    </symbol>
    <symbol id="catFace" viewBox="10 0 80 90">
      <g fill="#fcfcf6" stroke="#1f1f26" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <path d="M28 52 L24 14 L48 42"/>
        <path d="M72 52 L78 12 L54 42"/>
        <ellipse cx="50" cy="62" rx="27" ry="23"/>
        <ellipse cx="40" cy="59" rx="3.5" ry="5" fill="#1f1f26"/>
        <ellipse cx="60" cy="59" rx="3.5" ry="5" fill="#1f1f26"/>
        <path d="M47 66 h6 l-3 4 z" fill="#1f1f26"/>
        <path d="M50 70 q-3 4 -7 2 M50 70 q3 4 7 2" fill="none"/>
        <path d="M34 67 L16 64 M34 71 L17 74 M66 67 L84 64 M66 71 L83 74" fill="none"/>
      </g>
    </symbol>
  </defs>
</svg>

<div class="wrap">
  <header>
    <div>
      <h1><span class="u">うさぎ</span>と<span class="n">ねこ</span>の かけっこ</h1>
      <p class="byline">かんがえた ひと：むすめ（5さい）</p>
    </div>
    <button class="sound" id="soundBtn" type="button" aria-pressed="true">🔊 おと あり</button>
  </header>

  <div class="opts">
    <div class="group" role="group" aria-label="あそびかた">
      <span class="lbl">あそびかた</span>
      <button class="chip" id="m-solo" type="button" data-mode="solo" aria-pressed="true">ひとりで</button>
      <button class="chip" id="m-duo" type="button" data-mode="duo" aria-pressed="false">ふたりで</button>
    </div>
    <div class="group" id="levelGroup" role="group" aria-label="ねこのはやさ">
      <span class="lbl">ねこの はやさ</span>
      <button class="chip" id="l-slow" type="button" data-level="slow" aria-pressed="false">ゆっくり</button>
      <button class="chip" id="l-normal" type="button" data-level="normal" aria-pressed="true">ふつう</button>
      <button class="chip" id="l-fast" type="button" data-level="fast" aria-pressed="false">はやい</button>
    </div>
  </div>

  <div class="track" id="track">
    <div class="goal"></div>
    <div class="goal-flag">ゴール</div>

    <div class="lane" id="laneR">
      <div class="lane-name">うさぎ　ピッ×<b id="tapR">0</b></div>
      <div class="runner" id="runR"><div class="bob" id="bobR">
        <svg class="speed" id="spdR" viewBox="0 0 26 30"><g stroke="#1f1f26" stroke-width="2.5" stroke-linecap="round"><path d="M4 5 H22"/><path d="M1 15 H24"/><path d="M5 25 H21"/></g></svg>
        <svg class="char" viewBox="0 0 100 130" filter="url(#wobble)">
          <g fill="#fcfcf6" stroke="#1f1f26" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
            <path id="rLegL" d="M42 104 C40 114 40 122 44 126 C48 128 52 126 51 120 L50 104"/>
            <path id="rLegR" d="M52 104 C52 114 52 122 56 126 C60 128 64 126 63 120 L60 104"/>
            <path d="M38 80 C33 94 33 104 38 110 L62 110 C67 104 67 94 62 80 Z"/>
            <path id="rArmL" d="M38 88 L28 100" fill="none"/>
            <path id="rArmR" d="M62 88 L72 100" fill="none"/>
            <path d="M40 46 C28 32 26 6 38 4 C50 2 50 30 47 45"/>
            <path d="M40 38 C35 28 36 14 40 12" fill="none" stroke-width="2"/>
            <path d="M54 44 C54 20 66 0 76 6 C86 12 72 34 62 47"/>
            <path d="M60 36 C62 24 68 14 72 12" fill="none" stroke-width="2"/>
            <ellipse cx="50" cy="63" rx="28" ry="22"/>
            <circle cx="40" cy="60" r="5"/><circle cx="40" cy="60" r="2" fill="#1f1f26"/>
            <ellipse cx="60" cy="60" rx="3.2" ry="4.2" fill="#1f1f26"/>
            <path d="M34 55 l-3 -2 M64 55 l3 -2" fill="none" stroke-width="2"/>
            <path d="M48 67 l2 2 l2 -2 z" fill="#1f1f26"/>
            <path d="M50 69 q-3 5 -8 2 M50 69 q3 5 8 2" fill="none"/>
          </g>
          <circle cx="31" cy="70" r="4" fill="#f5b3c1"/><circle cx="69" cy="70" r="4" fill="#f5b3c1"/>
        </svg>
      </div></div>
    </div>

    <div class="lane" id="laneC">
      <div class="lane-name">ねこ　<span id="catWho">コンピュータ</span></div>
      <div class="runner" id="runC"><div class="bob" id="bobC">
        <svg class="speed" id="spdC" viewBox="0 0 26 30"><g stroke="#1f1f26" stroke-width="2.5" stroke-linecap="round"><path d="M4 5 H22"/><path d="M1 15 H24"/><path d="M5 25 H21"/></g></svg>
        <svg class="char" viewBox="0 0 100 130" filter="url(#wobble)">
          <g fill="#fcfcf6" stroke="#1f1f26" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
            <path id="cTail" d="M62 104 C80 104 86 90 80 78" fill="none"/>
            <path id="cLegL" d="M42 104 C40 114 40 122 44 126 C48 128 52 126 51 120 L50 104"/>
            <path id="cLegR" d="M52 104 C52 114 52 122 56 126 C60 128 64 126 63 120 L60 104"/>
            <path d="M38 80 C33 94 33 104 38 110 L62 110 C67 104 67 94 62 80 Z"/>
            <path id="cArmL" d="M38 88 L28 100" fill="none"/>
            <path id="cArmR" d="M62 88 L72 100" fill="none"/>
            <path d="M28 52 L24 14 L48 42"/>
            <path d="M72 52 L78 12 L54 42"/>
            <ellipse cx="50" cy="62" rx="27" ry="23"/>
            <ellipse cx="40" cy="59" rx="3.5" ry="5" fill="#1f1f26"/>
            <ellipse cx="60" cy="59" rx="3.5" ry="5" fill="#1f1f26"/>
            <path d="M47 66 h6 l-3 4 z" fill="#1f1f26"/>
            <path d="M50 70 q-3 4 -7 2 M50 70 q3 4 7 2" fill="none"/>
            <path d="M34 67 L16 64 M34 71 L17 74 M66 67 L84 64 M66 71 L83 74" fill="none" stroke-width="2"/>
          </g>
        </svg>
      </div></div>
    </div>

    <div class="msg" id="msg"></div>
  </div>

  <div class="controls" id="controls">
    <button class="big r" id="btnR" type="button" aria-label="うさぎを はしらせる">
      <svg aria-hidden="true"><use href="#rabbitFace"/></svg>
      <span class="t">ピピピ！</span>
      <span class="k">れんだで はしる（スペースキー）</span>
    </button>
    <button class="big c" id="btnC" type="button" aria-label="ねこを はしらせる" hidden>
      <svg aria-hidden="true"><use href="#catFace"/></svg>
      <span class="t">ピピピ！</span>
      <span class="k">れんだで はしる（Jキー）</span>
    </button>
  </div>

  <button class="go" id="goBtn" type="button">よーい どん！</button>
  <p class="hint" id="hint">うさぎの ボタンを ピピピピって たくさん おしてね</p>
</div>

<script>
(function(){
  var LEVEL = {slow:5.2, normal:7.6, fast:10.5};  // ねこの はやさ（%/びょう）
  var IMP = 4.2, DECAY = 2.4, VMAX = 24;
  var S = {mode:'solo', level:'normal', phase:'ready', t0:0, winner:null,
    r:{p:0,v:0,taps:0,ph:0}, c:{p:0,v:0,taps:0,ph:0}};

  var $ = function(id){return document.getElementById(id)};
  var track=$('track'), msg=$('msg'), goBtn=$('goBtn'), hint=$('hint');
  var btnR=$('btnR'), btnC=$('btnC');
  var run={r:$('runR'), c:$('runC')}, bob={r:$('bobR'), c:$('bobC')}, spd={r:$('spdR'), c:$('spdC')};
  var legs={r:[$('rLegL'),$('rLegR'),$('rArmL'),$('rArmR')], c:[$('cLegL'),$('cLegR'),$('cArmL'),$('cArmR')]};

  // ---- おと ----
  var ac=null, sound=true;
  function tone(f,d,type,vol,delay){
    if(!sound) return;
    try{
      ac = ac || new (window.AudioContext||window.webkitAudioContext)();
      if(ac.state==='suspended') ac.resume();
      var t=ac.currentTime+(delay||0), o=ac.createOscillator(), g=ac.createGain();
      o.type=type||'square'; o.frequency.setValueAtTime(f,t);
      g.gain.setValueAtTime(vol||0.05,t); g.gain.exponentialRampToValueAtTime(0.0001,t+d);
      o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t+d+0.02);
    }catch(e){}
  }
  function fanfare(){ [523,659,784,1047].forEach(function(f,i){ tone(f,0.18,'triangle',0.08,i*0.13); }); tone(1047,0.5,'triangle',0.08,0.55); }
  $('soundBtn').addEventListener('click',function(){
    sound=!sound; this.setAttribute('aria-pressed',sound); this.textContent = sound?'🔊 おと あり':'🔇 おと なし';
  });

  // ---- せってい ----
  function setMode(m){
    S.mode=m;
    ['solo','duo'].forEach(function(k){ $('m-'+k).setAttribute('aria-pressed', k===m); });
    $('levelGroup').hidden = (m==='duo');
    btnC.hidden = (m!=='duo');
    $('controls').classList.toggle('duo', m==='duo');
    $('catWho').textContent = m==='duo' ? 'ふたりめ' : 'コンピュータ';
    hint.textContent = m==='duo' ? 'うさぎと ねこ、どっちが はやく おせるかな？' : 'うさぎの ボタンを ピピピピって たくさん おしてね';
    reset();
  }
  function setLevel(l){
    S.level=l;
    ['slow','normal','fast'].forEach(function(k){ $('l-'+k).setAttribute('aria-pressed', k===l); });
    reset();
  }
  document.querySelectorAll('[data-mode]').forEach(function(b){ b.addEventListener('click',function(){ if(S.phase!=='count'&&S.phase!=='run') setMode(b.dataset.mode); }); });
  document.querySelectorAll('[data-level]').forEach(function(b){ b.addEventListener('click',function(){ if(S.phase!=='count'&&S.phase!=='run') setLevel(b.dataset.level); }); });

  function reset(){
    S.phase='ready'; S.winner=null;
    ['r','c'].forEach(function(k){ S[k].p=0; S[k].v=0; S[k].taps=0; S[k].ph=0; run[k].classList.remove('win'); });
    $('tapR').textContent='0';
    msg.innerHTML='';
    goBtn.hidden=false; goBtn.textContent='よーい どん！';
    render(0);
  }

  function say(big, sub){
    msg.innerHTML = '<div class="big-t pop">'+big+'</div>' + (sub?'<div class="sub-t">'+sub+'</div>':'');
  }

  function start(){
    if(S.phase==='count'||S.phase==='run') return;
    reset();
    S.phase='count'; goBtn.hidden=true;
    var seq=['3','2','1'], i=0;
    (function step(){
      if(i<seq.length){ say(seq[i]); tone(660,0.15,'square',0.06); i++; setTimeout(step,750); }
      else { say('どん！'); tone(1320,0.3,'square',0.07); S.phase='run'; S.t0=performance.now(); setTimeout(function(){ if(S.phase==='run') msg.innerHTML=''; },600); }
    })();
  }
  goBtn.addEventListener('click',start);

  // ---- ピピピ ----
  function tap(k){
    if(S.phase!=='run') return;
    var o=S[k]; o.v=Math.min(VMAX,o.v+IMP); o.taps++;
    if(k==='r') $('tapR').textContent=o.taps;
    tone(k==='r'?1400:1100,0.04,'square',0.035);
  }
  function bindBtn(btn,k){
    btn.addEventListener('pointerdown',function(e){ e.preventDefault(); tap(k); });
    btn.addEventListener('keydown',function(e){ if(e.key==='Enter'){ e.preventDefault(); tap(k);} });
    btn.addEventListener('contextmenu',function(e){ e.preventDefault(); });
  }
  bindBtn(btnR,'r'); bindBtn(btnC,'c');
  function flash(btn){ btn.classList.add('pressed'); setTimeout(function(){ btn.classList.remove('pressed'); },70); }
  document.addEventListener('keydown',function(e){
    if(e.repeat) return;
    if(e.code==='Space'||e.key==='f'||e.key==='F'){ e.preventDefault(); if(S.phase==='ready'||S.phase==='done'){ start(); } else { tap('r'); flash(btnR);} }
    else if((e.key==='j'||e.key==='J') && S.mode==='duo'){ tap('c'); flash(btnC); }
  });

  // ---- うごき ----
  function finish(k){
    S.phase='done'; S.winner=k;
    run[k].classList.add('win');
    var sec=((performance.now()-S.t0)/1000).toFixed(1);
    var name = k==='r' ? 'うさぎ' : 'ねこ';
    var sub = sec+' びょうで ゴール！';
    if(S.mode==='solo'){
      sub += k==='r' ? '　ピッ×'+S.r.taps : '　つぎは もっと ピピピ！';
    }
    say(name+'の かち！', sub);
    fanfare();
    goBtn.hidden=false; goBtn.textContent='もういっかい';
  }

  function render(dt){
    var w = track.clientWidth - run.r.offsetWidth - 34;
    ['r','c'].forEach(function(k){
      var o=S[k];
      run[k].style.transform='translateX('+(Math.min(o.p,100)/100*w)+'px)';
      var amt=Math.min(1,o.v/7);
      o.ph += o.v*dt*1.4;
      var sw=Math.sin(o.ph)*28*amt;
      bob[k].style.transform='translateY('+(-Math.abs(Math.sin(o.ph))*7*amt)+'px) rotate('+(amt*6)+'deg)';
      legs[k][0].setAttribute('transform','rotate('+sw+' 46 104)');
      legs[k][1].setAttribute('transform','rotate('+(-sw)+' 56 104)');
      legs[k][2].setAttribute('transform','rotate('+(-sw)+' 38 88)');
      legs[k][3].setAttribute('transform','rotate('+sw+' 62 88)');
      spd[k].style.opacity = Math.max(0,(o.v-6)/10).toFixed(2);
    });
  }

  var last=performance.now();
  function loop(now){
    var dt=Math.min(0.05,(now-last)/1000); last=now;
    if(S.phase==='run'){
      var el=(now-S.t0)/1000;
      ['r','c'].forEach(function(k){
        var o=S[k];
        if(k==='c' && S.mode==='solo'){
          var base=LEVEL[S.level];
          var target=base*(1+0.18*Math.sin(el*2.3)+0.08*Math.sin(el*5.1));
          o.v = Math.min(target, el*base*1.6);
        } else {
          o.v *= Math.exp(-DECAY*dt);
          if(o.v<0.05) o.v=0;
        }
        o.p += o.v*dt;
      });
      if(S.r.p>=100 || S.c.p>=100){ finish(S.r.p>=S.c.p?'r':'c'); }
    } else if(S.phase==='done'){
      ['r','c'].forEach(function(k){ S[k].v*=Math.exp(-4*dt); });
    }
    render(dt);
    requestAnimationFrame(loop);
  }
  window.addEventListener('resize',function(){ render(0); });
  reset();
  requestAnimationFrame(loop);
})();
</script>

</body>
</html>
