<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>うちのこゲームミュージアム</title>
<link href="https://fonts.googleapis.com/css2?family=Yusei+Magic&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family:'Yusei Magic', 'Hiragino Maru Gothic ProN', sans-serif;
    background:#fdfbf5; color:#1a1a1a;
    line-height:1.8;
  }
  .container { max-width:960px; margin:0 auto; padding:0 20px; }

  /* ===== ヘッダー ===== */
  header { text-align:center; padding:56px 20px 28px; }
  .site-title {
    font-size:clamp(30px, 6vw, 46px); letter-spacing:2px;
    transform:rotate(-1deg); display:inline-block;
  }
  .site-title .tilt { display:inline-block; transform:rotate(2deg); }
  .tagline {
    margin-top:14px; font-size:clamp(13px, 2.6vw, 16px); color:#555;
    transform:rotate(-0.4deg);
  }
  .crayon-line {
    width:180px; height:6px; margin:22px auto 0; border-radius:3px;
    background:linear-gradient(90deg,#ffd6e0 0 33%,#fff3b0 33% 66%,#cde8ff 66%);
    transform:rotate(-0.6deg);
  }

  /* ===== 統計 ===== */
  .stats { display:flex; justify-content:center; gap:14px; flex-wrap:wrap; padding:10px 0 8px; }
  .stat {
    background:#fff; border:3px solid #1a1a1a; padding:10px 22px;
    border-radius:18px 22px 16px 24px / 22px 16px 24px 18px;
    text-align:center; transform:rotate(-1deg);
  }
  .stat:nth-child(2){ transform:rotate(0.8deg); }
  .stat:nth-child(3){ transform:rotate(-0.5deg); }
  .stat b { font-size:26px; display:block; line-height:1.3; }
  .stat span { font-size:12px; color:#666; }

  /* ===== フィルターチップ ===== */
  .filters { display:flex; justify-content:center; gap:10px; flex-wrap:wrap; margin-top:18px; }
  .chip {
    font-family:inherit; font-size:14px; cursor:pointer;
    padding:6px 20px; background:#fff; color:#1a1a1a;
    border:3px solid #1a1a1a; border-radius:30px;
    transform:rotate(-0.8deg); transition:transform .12s ease;
  }
  .chip:nth-child(2){ transform:rotate(0.6deg); }
  .chip:nth-child(3){ transform:rotate(-0.4deg); }
  .chip:hover { transform:rotate(0deg) translateY(-2px); }
  .chip.on { background:#fff3b0; box-shadow:3px 3px 0 rgba(26,26,26,.18); }

  /* ===== 年グループ ===== */
  .year-block { margin-top:44px; }
  .year-label {
    display:inline-flex; align-items:baseline; gap:8px;
    font-size:24px; padding:4px 20px;
    background:#fff3b0; border:3px solid #1a1a1a;
    border-radius:255px 15px 225px 15px / 15px 225px 15px 255px;
    transform:rotate(-1.2deg);
  }
  .year-label small { font-size:13px; color:#666; }

  /* ===== カードグリッド ===== */
  .grid {
    display:grid; grid-template-columns:repeat(auto-fill, minmax(270px, 1fr));
    gap:26px; margin-top:24px;
  }
  .card {
    background:#fff; border:3px solid #1a1a1a;
    border-radius:22px 18px 24px 16px / 18px 24px 16px 22px;
    overflow:hidden; cursor:pointer;
    transition:transform .18s ease, box-shadow .18s ease;
    display:flex; flex-direction:column;
  }
  .card:nth-child(3n+1){ transform:rotate(-0.7deg); }
  .card:nth-child(3n+2){ transform:rotate(0.6deg); }
  .card:nth-child(3n)  { transform:rotate(-0.3deg); }
  .card:hover { transform:rotate(0deg) translateY(-5px); box-shadow:0 10px 0 rgba(26,26,26,.12); }

  /* サムネイル：ミニプレビュー */
  .thumb {
    position:relative; height:190px; overflow:hidden;
    background:#fdfbf5; border-bottom:3px solid #1a1a1a;
  }
  .thumb .fallback {
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-size:64px;
  }
  .thumb iframe {
    position:absolute; top:0; left:50%;
    width:480px; height:760px;
    transform:translateX(-50%) scale(0.4); transform-origin:top center;
    border:0; pointer-events:none; background:#fdfbf5;
  }
  .thumb .play-hint {
    position:absolute; right:10px; bottom:10px;
    background:#1a1a1a; color:#fff; font-size:13px;
    padding:4px 14px; border-radius:20px; opacity:.85;
  }

  .card-body { padding:16px 18px 18px; display:flex; flex-direction:column; gap:8px; flex:1; }
  .card-title { font-size:18px; line-height:1.5; }
  .meta { display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
  .badge {
    font-size:12px; padding:2px 12px;
    border:2px solid #1a1a1a; border-radius:20px; background:#fff;
  }
  .badge.maker { font-weight:bold; }
  .badge.age { background:#fff3b0; }
  .memo { font-size:13.5px; color:#555; flex:1; }
  .date-line { font-size:12px; color:#999; }

  /* いいね・コメントボタン */
  .card-foot { display:flex; align-items:center; gap:8px; margin-top:4px; }
  .card-foot .date-line { margin-left:auto; }
  .react-btn {
    font-family:inherit; font-size:13px; cursor:pointer;
    display:inline-flex; align-items:center; gap:5px;
    padding:4px 14px; background:#fff; color:#1a1a1a;
    border:2px solid #1a1a1a; border-radius:20px;
    transition:transform .12s ease;
  }
  .react-btn:hover { transform:translateY(-2px); }
  .react-btn:active { transform:scale(.92); }
  .like-btn.liked { background:#ffd6e0; }
  .like-btn .heart { font-size:14px; }
  .like-btn.liked .heart { animation:beat .4s ease; }
  @keyframes beat { 0%{transform:scale(1);} 40%{transform:scale(1.5);} 100%{transform:scale(1);} }

  /* 原画ポラロイド */
  .sketch-row { display:flex; flex-wrap:wrap; gap:10px; margin-top:6px; }
  .sketch {
    background:#fff; border:2px solid #1a1a1a;
    padding:5px 5px 4px; transform:rotate(1.5deg);
    cursor:zoom-in; transition:transform .15s ease;
  }
  .sketch:nth-child(2){ transform:rotate(-1.2deg); }
  .sketch:nth-child(3){ transform:rotate(0.8deg); }
  .sketch:hover { transform:rotate(0deg) scale(1.06); }
  .sketch img { width:82px; height:82px; object-fit:cover; display:block; }
  .sketch figcaption {
    font-size:9px; text-align:center; color:#888;
    max-width:82px; line-height:1.4; padding-top:3px;
  }

  /* ===== つくりかたセクション ===== */
  .howto { margin-top:70px; text-align:center; }
  .howto h2 {
    display:inline-block; font-size:22px; padding:4px 24px;
    background:#cde8ff; border:3px solid #1a1a1a;
    border-radius:15px 225px 15px 255px / 225px 15px 255px 15px;
    transform:rotate(0.8deg);
  }
  .steps { display:flex; justify-content:center; gap:14px; flex-wrap:wrap; margin-top:26px; }
  .step {
    width:200px; background:#fff; border:3px solid #1a1a1a;
    border-radius:20px 16px 22px 18px / 16px 22px 18px 20px;
    padding:20px 16px; transform:rotate(-1deg);
  }
  .step:nth-child(2){ transform:rotate(1deg); }
  .step:nth-child(3){ transform:rotate(-0.5deg); }
  .step .num {
    width:34px; height:34px; margin:0 auto 10px;
    border:3px solid #1a1a1a; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:16px; background:#ffd6e0;
  }
  .step:nth-child(2) .num { background:#fff3b0; }
  .step:nth-child(3) .num { background:#cde8ff; }
  .step .icon { font-size:36px; }
  .step h3 { font-size:15px; margin-top:6px; }
  .step p { font-size:12px; color:#666; margin-top:4px; line-height:1.6; }
  .arrow { align-self:center; font-size:24px; color:#aaa; }
  .guide-link {
    display:inline-block; margin-top:28px; font-size:17px; color:#1a1a1a;
    background:#ffd6e0; border:3px solid #1a1a1a; padding:12px 28px;
    border-radius:255px 15px 225px 15px / 15px 225px 15px 255px;
    text-decoration:none; transform:rotate(-0.8deg);
    transition:transform .15s ease;
  }
  .guide-link:hover { transform:rotate(0deg) translateY(-3px); }

  footer { text-align:center; padding:60px 20px 40px; font-size:13px; color:#999; }

  /* ===== プレイヤーモーダル ===== */
  #player {
    position:fixed; inset:0; z-index:100; display:none;
    background:rgba(26,26,26,.72);
    align-items:center; justify-content:center; padding:16px;
  }
  #player.open { display:flex; }
  .player-frame {
    position:relative; width:min(480px, 100%); height:min(820px, 96vh);
    background:#fdfbf5; border:4px solid #1a1a1a;
    border-radius:24px; overflow:hidden;
    box-shadow:0 14px 0 rgba(0,0,0,.3);
    display:flex; flex-direction:column;
  }
  .player-bar {
    display:flex; align-items:center; gap:8px;
    padding:8px 12px; border-bottom:3px solid #1a1a1a; background:#fff;
  }
  .player-bar .p-title { flex:1; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .player-bar a, .player-bar button {
    font-family:inherit; font-size:13px; cursor:pointer;
    border:2px solid #1a1a1a; border-radius:14px; background:#fff;
    padding:3px 12px; color:#1a1a1a; text-decoration:none; line-height:1.6;
  }
  .player-bar button.close { background:#ffd6e0; }
  #playerFrame { flex:1; width:100%; border:0; }

  /* ===== 原画ライトボックス ===== */
  #lightbox {
    position:fixed; inset:0; z-index:120; display:none;
    background:rgba(26,26,26,.78);
    align-items:center; justify-content:center; padding:20px;
  }
  #lightbox.open { display:flex; }
  .lb-frame {
    background:#fff; border:4px solid #1a1a1a; border-radius:6px;
    padding:12px 12px 14px; max-width:min(680px, 94vw);
    box-shadow:0 14px 0 rgba(0,0,0,.3); transform:rotate(-0.6deg);
    display:flex; flex-direction:column; gap:8px;
  }
  .lb-frame img {
    max-width:100%; max-height:min(70vh, 640px);
    object-fit:contain; display:block; border:2px solid #1a1a1a;
  }
  .lb-foot { display:flex; align-items:center; gap:10px; }
  .lb-foot .lb-cap { flex:1; font-size:14px; color:#555; }
  .lb-foot button {
    font-family:inherit; font-size:13px; cursor:pointer;
    border:2px solid #1a1a1a; border-radius:14px; background:#ffd6e0;
    padding:4px 16px;
  }

  /* ===== コメントモーダル ===== */
  #cmtModal {
    position:fixed; inset:0; z-index:110; display:none;
    background:rgba(26,26,26,.72);
    align-items:center; justify-content:center; padding:16px;
  }
  #cmtModal.open { display:flex; }
  .cmt-frame {
    width:min(480px, 100%); max-height:92vh;
    background:#fdfbf5; border:4px solid #1a1a1a; border-radius:24px;
    overflow:hidden; box-shadow:0 14px 0 rgba(0,0,0,.3);
    display:flex; flex-direction:column;
  }
  .cmt-note {
    margin:12px 14px 0; padding:10px 14px; font-size:12.5px; color:#7a5b00;
    background:#fff3b0; border:2px dashed #d5b100; border-radius:12px;
  }
  #cmtList { flex:1; overflow-y:auto; padding:12px 14px; display:flex; flex-direction:column; gap:10px; }
  .cmt-item {
    background:#fff; border:2px solid #1a1a1a;
    border-radius:16px 18px 14px 20px / 18px 14px 20px 16px;
    padding:10px 14px; transform:rotate(-0.4deg);
  }
  .cmt-item:nth-child(even){ transform:rotate(0.4deg); }
  .cmt-item .cmt-head { display:flex; gap:8px; align-items:baseline; }
  .cmt-item .cmt-name { font-size:13px; font-weight:bold; }
  .cmt-item .cmt-date { font-size:10px; color:#aaa; }
  .cmt-item .cmt-body { font-size:14px; margin-top:2px; white-space:pre-wrap; word-break:break-word; }
  .cmt-empty { text-align:center; color:#999; font-size:13px; padding:20px 0; }
  #cmtForm { border-top:3px solid #1a1a1a; background:#fff; padding:10px 14px 14px; }
  .stamp-row { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:8px; }
  .stamp {
    font-family:inherit; font-size:12px; cursor:pointer;
    border:2px solid #1a1a1a; border-radius:16px; background:#fdfbf5;
    padding:3px 12px;
  }
  .stamp:hover { background:#fff3b0; }
  #cmtForm input, #cmtForm textarea {
    font-family:inherit; font-size:14px; width:100%;
    border:2px solid #1a1a1a; border-radius:10px; padding:7px 10px;
    background:#fdfbf5; margin-bottom:8px;
  }
  #cmtForm textarea { height:64px; resize:none; }
  .cmt-send-row { display:flex; align-items:center; gap:10px; }
  #cmtError { flex:1; font-size:12px; color:#c0392b; }
  #cmtSend {
    font-family:inherit; font-size:15px; cursor:pointer;
    border:3px solid #1a1a1a; border-radius:20px; background:#ffd6e0;
    padding:7px 26px; box-shadow:3px 3px 0 #1a1a1a;
  }
  #cmtSend:active { transform:translate(2px,2px); box-shadow:1px 1px 0 #1a1a1a; }
  #cmtSend:disabled { opacity:.5; cursor:default; }
</style>
</head>
<body>

<header class="container">
  <h1 class="site-title" id="siteTitle"></h1>
  <p class="tagline" id="tagline"></p>
  <div class="crayon-line"></div>
</header>

<div class="container">
  <div class="stats" id="stats"></div>
  <div class="filters" id="filters" role="group" aria-label="つくった人でしぼりこむ"></div>
  <main id="timeline"></main>

  <section class="howto">
    <h2>ゲームのつくりかた</h2>
    <div class="steps">
      <div class="step">
        <div class="num">1</div>
        <div class="icon">🖍️</div>
        <h3>えをかく</h3>
        <p>あたまのなかのアイディアを、えや ずにかきおこす</p>
      </div>
      <div class="arrow">→</div>
      <div class="step">
        <div class="num">2</div>
        <div class="icon">🎤</div>
        <h3>こえでせつめい</h3>
        <p>どんなゲームか、ボイスメモにふきこむ</p>
      </div>
      <div class="arrow">→</div>
      <div class="step">
        <div class="num">3</div>
        <div class="icon">🤖</div>
        <h3>Claudeとつくる</h3>
        <p>えとこえをもとに、AIといっしょにゲームをつくる</p>
      </div>
    </div>
    <a class="guide-link" href="guide.html">📖 くわしいつくりかたガイドを見る →</a>
  </section>
</div>

<footer id="footer"></footer>

<!-- 原画ライトボックス -->
<div id="lightbox" role="dialog" aria-modal="true" aria-label="原画かくだい表示">
  <figure class="lb-frame">
    <img id="lbImg" src="" alt="">
    <div class="lb-foot">
      <figcaption class="lb-cap" id="lbCap"></figcaption>
      <button id="lbClose">とじる ×</button>
    </div>
  </figure>
</div>

<!-- コメントモーダル -->
<div id="cmtModal" role="dialog" aria-modal="true" aria-label="おうえんコメント">
  <div class="cmt-frame">
    <div class="player-bar">
      <span class="p-title" id="cmtTitle"></span>
      <button class="close" id="cmtClose">とじる ×</button>
    </div>
    <div class="cmt-note">🌟 ここは <b>いいところを つたえる ばしょ</b>だよ。「すごい！」「かわいい！」を どんどん おくって、つぎの さくひんの パワーにしよう😊</div>
    <div id="cmtList"></div>
    <form id="cmtForm">
      <div class="stamp-row" id="stampRow">
        <button type="button" class="stamp">🌟 すごい！</button>
        <button type="button" class="stamp">🥰 かわいい！</button>
        <button type="button" class="stamp">😆 おもしろい！</button>
        <button type="button" class="stamp">🎮 またあそぶ！</button>
      </div>
      <input id="cmtName" type="text" maxlength="20" placeholder="なまえ（パパ・ママ・おばあちゃん など）">
      <textarea id="cmtBody" maxlength="300" placeholder="すごいと おもったところを おしえてあげよう！"></textarea>
      <div class="cmt-send-row">
        <span id="cmtError"></span>
        <button type="submit" id="cmtSend">おくる 💌</button>
      </div>
    </form>
  </div>
</div>

<!-- プレイヤーモーダル -->
<div id="player" role="dialog" aria-modal="true" aria-label="ゲームプレイヤー">
  <div class="player-frame">
    <div class="player-bar">
      <span class="p-title" id="playerTitle"></span>
      <a id="playerNewTab" href="#" target="_blank" rel="noopener">べつタブで</a>
      <button class="close" id="playerClose">とじる ×</button>
    </div>
    <iframe id="playerFrame" src="about:blank" allow="autoplay"></iframe>
  </div>
</div>

<script src="games.js"></script>
<script>
(function () {
  /* ---------- ユーティリティ ---------- */
  function parseDate(s) {
    if (!s) return null;
    if (s.length === 7) s += "-01";   // "YYYY-MM" 形式に対応
    return new Date(s + "T00:00:00");
  }

  function calcAge(birthdayStr, dateStr) {
    if (!birthdayStr || !dateStr) return null;
    const b = parseDate(birthdayStr), d = parseDate(dateStr);
    let age = d.getFullYear() - b.getFullYear();
    if (d.getMonth() < b.getMonth() ||
        (d.getMonth() === b.getMonth() && d.getDate() < b.getDate())) age--;
    return age;
  }

  /* ゲームの age 欄を優先し、なければ誕生日から自動計算 */
  function ageFor(g, m) {
    if (g.age != null) {
      if (typeof g.age === "number") return g.age;
      if (g.age[m.key] != null) return g.age[m.key];
    }
    return calcAge(m.birthday, g.date);
  }

  function fmtDate(s) {
    const d = parseDate(s);
    if (!d) return "日付ふめい";
    const ymd = d.getFullYear() + "年" + (d.getMonth() + 1) + "月";
    return s.length === 7 ? ymd : ymd + d.getDate() + "日";
  }

  function makers(g) {
    if (!g.maker) return [];
    return (Array.isArray(g.maker) ? g.maker : [g.maker])
      .map(k => ({ key: k, ...FAMILY[k] }))
      .filter(m => m.name);
  }

  /* ---------- ヘッダー・統計 ---------- */
  document.title = SITE.title;
  const t = SITE.title;
  const half = Math.ceil(t.length / 2);
  document.getElementById("siteTitle").innerHTML =
    escapeHtml(t.slice(0, half)) + '<span class="tilt">' + escapeHtml(t.slice(half)) + "</span>";
  document.getElementById("tagline").textContent = SITE.tagline;
  document.getElementById("footer").textContent =
    SITE.title + " — かぞくの さくひんしゅう";

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c =>
      ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
  }

  const sorted = GAMES.slice().sort((a, b) => (b.date || "").localeCompare(a.date || ""));
  const statsEl = document.getElementById("stats");
  statsEl.innerHTML = [
    [sorted.length, "さくひん"],
    [new Set(sorted.map(g => (g.date || "").slice(0, 4)).filter(Boolean)).size, "ねんかん"],
  ].map(([v, l]) => `<div class="stat"><b>${v}</b><span>${l}</span></div>`).join("");

  /* ---------- フィルターチップ ---------- */
  const filtersEl = document.getElementById("filters");
  const makerKeys = Object.keys(FAMILY).filter(k =>
    sorted.some(g => makers(g).some(m => m.key === k)));
  let currentFilter = "all";

  function renderChips() {
    const chips = [{ key: "all", label: "ぜんぶ" }].concat(
      makerKeys.map(k => ({ key: k, label: FAMILY[k].emoji + " " + FAMILY[k].name, color: FAMILY[k].color })));
    filtersEl.innerHTML = chips.map(c => `
      <button class="chip${c.key === currentFilter ? " on" : ""}"
              data-key="${c.key}" aria-pressed="${c.key === currentFilter}"
              ${c.key === currentFilter && c.color ? `style="background:${c.color}"` : ""}>
        ${c.label}
      </button>`).join("");
    filtersEl.querySelectorAll(".chip").forEach(btn =>
      btn.addEventListener("click", () => {
        currentFilter = btn.dataset.key;
        renderChips();
        renderTimeline();
      }));
  }

  /* ---------- タイムライン ---------- */
  const timeline = document.getElementById("timeline");

  function renderTimeline() {
    const list = currentFilter === "all"
      ? sorted
      : sorted.filter(g => makers(g).some(m => m.key === currentFilter));

    timeline.innerHTML = "";
    if (!list.length) {
      timeline.innerHTML = '<p style="text-align:center;padding:60px 0;color:#999;">まだ さくひんが ないよ</p>';
      return;
    }
    const byYear = {};
    list.forEach(g => {
      const y = g.date ? g.date.slice(0, 4) : "？？？？";
      (byYear[y] = byYear[y] || []).push(g);
    });
    Object.keys(byYear).sort().reverse().forEach(year => {
      const block = document.createElement("section");
      block.className = "year-block";
      block.innerHTML =
        `<h2 class="year-label">${year}ねん <small>${byYear[year].length}さくひん</small></h2>`;
      const grid = document.createElement("div");
      grid.className = "grid";
      byYear[year].forEach(g => grid.appendChild(buildCard(g)));
      block.appendChild(grid);
      timeline.appendChild(block);
    });
    refreshCounts();
  }

  /* 原画（文字列1枚 or {src,label}の配列） */
  function sketchRow(g) {
    if (!g.sketch) return "";
    const list = (Array.isArray(g.sketch) ? g.sketch : [g.sketch])
      .map(s => typeof s === "string" ? { src: s, label: "げんが" } : s);
    return `<div class="sketch-row">` + list.map(s => `
      <figure class="sketch" data-src="${encodeURI(s.src)}">
        <img src="${encodeURI(s.src)}"
             alt="${escapeHtml(g.title)} の原画：${escapeHtml(s.label || "げんが")}">
        <figcaption>${escapeHtml(s.label || "げんが")}</figcaption>
      </figure>`).join("") + `</div>`;
  }

  function buildCard(g) {
    const card = document.createElement("article");
    card.className = "card";
    card.setAttribute("role", "button");
    card.setAttribute("tabindex", "0");
    card.setAttribute("aria-label", g.title + " をあそぶ");

    const ms = makers(g);
    const badges = ms.map(m =>
      `<span class="badge maker" style="background:${m.color}">${m.emoji} ${escapeHtml(m.name)}</span>`
    );
    ms.forEach(m => {
      const age = ageFor(g, m);
      const ageText = (age === null ? "？" : age) + "さい";
      badges.push(`<span class="badge age">つくったとき ${ms.length > 1 ? m.emoji + " " : ""}${ageText}</span>`);
    });

    card.innerHTML = `
      <div class="thumb">
        <div class="fallback">${g.emoji || "🎮"}</div>
        <iframe src="${encodeURI(g.file)}" loading="lazy" tabindex="-1"
                scrolling="no" title="${escapeHtml(g.title)} プレビュー"></iframe>
        <span class="play-hint">▶ あそぶ</span>
      </div>
      <div class="card-body">
        <h3 class="card-title">${escapeHtml(g.title)}</h3>
        <div class="meta">${badges.join("")}</div>
        <p class="memo">${escapeHtml(g.memo || "")}</p>
        ${sketchRow(g)}
        <div class="card-foot">
          <button class="react-btn like-btn" data-file="${encodeURI(g.file)}"
                  aria-label="${escapeHtml(g.title)} にいいね">
            <span class="heart">♥</span><span class="lk">0</span></button>
          <button class="react-btn cmt-btn" data-file="${encodeURI(g.file)}"
                  aria-label="${escapeHtml(g.title)} におうえんコメント">
            💬 <span class="ck">0</span></button>
          <span class="date-line">📅 ${fmtDate(g.date)}</span>
        </div>
      </div>`;

    card.querySelectorAll(".sketch").forEach(fig => {
      const label = fig.querySelector("figcaption").textContent;
      fig.addEventListener("click", e => {
        e.stopPropagation();
        openLightbox(fig.dataset.src, g.title + " ── " + label);
      });
    });
    card.querySelector(".like-btn").addEventListener("click", e => {
      e.stopPropagation();
      toggleLike(g.file);
    });
    card.querySelector(".cmt-btn").addEventListener("click", e => {
      e.stopPropagation();
      openComments(g);
    });

    const open = () => openPlayer(g);
    card.addEventListener("click", open);
    card.addEventListener("keydown", e => {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); open(); }
    });
    return card;
  }

  /* ---------- プレイヤー ---------- */
  const player = document.getElementById("player");
  const frame = document.getElementById("playerFrame");

  function openPlayer(g) {
    document.getElementById("playerTitle").textContent = g.title;
    document.getElementById("playerNewTab").href = g.file;
    frame.src = g.file;
    player.classList.add("open");
    document.body.style.overflow = "hidden";
  }
  function closePlayer() {
    player.classList.remove("open");
    frame.src = "about:blank";
    document.body.style.overflow = "";
  }
  document.getElementById("playerClose").addEventListener("click", closePlayer);
  player.addEventListener("click", e => { if (e.target === player) closePlayer(); });

  /* ---------- 原画ライトボックス ---------- */
  const lightbox = document.getElementById("lightbox");

  function openLightbox(src, caption) {
    document.getElementById("lbImg").src = src;
    document.getElementById("lbImg").alt = caption;
    document.getElementById("lbCap").textContent = caption;
    lightbox.classList.add("open");
  }
  function closeLightbox() {
    lightbox.classList.remove("open");
    document.getElementById("lbImg").src = "";
  }
  document.getElementById("lbClose").addEventListener("click", closeLightbox);
  lightbox.addEventListener("click", e => { if (e.target === lightbox) closeLightbox(); });

  /* ---------- いいね・コメント データ層 ----------
     album-api.php（サーバー保存・家族で共有）が使えないときは
     localStorage（この端末だけ）に自動フォールバック */
  const API = "album-api.php";
  let album = {};
  let serverMode = true;

  function localLoad() {
    try { return JSON.parse(localStorage.getItem("albumLocal") || "{}"); }
    catch (e) { return {}; }
  }
  function localSave() { localStorage.setItem("albumLocal", JSON.stringify(album)); }

  function entryOf(file) {
    if (!album[file]) album[file] = { likes: 0, likedByMe: false, comments: [] };
    return album[file];
  }

  function refreshCounts() {
    document.querySelectorAll(".like-btn").forEach(b => {
      const en = entryOf(decodeURI(b.dataset.file));
      b.querySelector(".lk").textContent = en.likes;
      b.classList.toggle("liked", !!en.likedByMe);
    });
    document.querySelectorAll(".cmt-btn").forEach(b => {
      b.querySelector(".ck").textContent = entryOf(decodeURI(b.dataset.file)).comments.length;
    });
  }

  async function loadAlbum() {
    try {
      const r = await fetch(API, { cache: "no-store" });
      if (!r.ok) throw new Error();
      const j = await r.json();
      album = j.games || {};
      serverMode = true;
    } catch (e) {
      serverMode = false;
      album = localLoad();
    }
    refreshCounts();
  }

  async function toggleLike(file) {
    const en = entryOf(file);
    en.likedByMe = !en.likedByMe;                 // 先に見た目を更新
    en.likes = Math.max(0, en.likes + (en.likedByMe ? 1 : -1));
    refreshCounts();
    if (serverMode) {
      try {
        const r = await fetch(API + "?action=like", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ game: file }),
        });
        const j = await r.json();
        en.likes = j.count; en.likedByMe = j.liked;
      } catch (e) { serverMode = false; localSave(); }
    } else {
      localSave();
    }
    refreshCounts();
  }

  /* ---------- コメントモーダル ---------- */
  const cmtModal = document.getElementById("cmtModal");
  const cmtBody = document.getElementById("cmtBody");
  const cmtName = document.getElementById("cmtName");
  const cmtError = document.getElementById("cmtError");
  let cmtGame = null;

  function fmtCmtDate(s) { return s ? s.slice(0, 16).replace(/-/g, "/") : ""; }

  function renderComments() {
    const list = entryOf(cmtGame).comments;
    const el = document.getElementById("cmtList");
    el.innerHTML = list.length
      ? list.map(c => `
          <div class="cmt-item">
            <div class="cmt-head">
              <span class="cmt-name">${escapeHtml(c.nickname)}</span>
              <span class="cmt-date">${escapeHtml(fmtCmtDate(c.created_at))}</span>
            </div>
            <div class="cmt-body">${escapeHtml(c.body)}</div>
          </div>`).join("")
      : '<div class="cmt-empty">まだ おうえんが ないよ。いちばんのりで おくろう！</div>';
    el.scrollTop = el.scrollHeight;
  }

  function openComments(g) {
    cmtGame = g.file;
    document.getElementById("cmtTitle").textContent = g.title + " への おうえん";
    cmtName.value = localStorage.getItem("albumName") || "";
    cmtError.textContent = "";
    renderComments();
    cmtModal.classList.add("open");
    document.body.style.overflow = "hidden";
  }
  function closeComments() {
    cmtModal.classList.remove("open");
    document.body.style.overflow = "";
  }
  document.getElementById("cmtClose").addEventListener("click", closeComments);
  cmtModal.addEventListener("click", e => { if (e.target === cmtModal) closeComments(); });

  document.getElementById("stampRow").addEventListener("click", e => {
    const btn = e.target.closest(".stamp");
    if (!btn) return;
    cmtBody.value = (cmtBody.value ? cmtBody.value + " " : "") + btn.textContent.trim();
    cmtBody.focus();
  });

  document.getElementById("cmtForm").addEventListener("submit", async e => {
    e.preventDefault();
    const body = cmtBody.value.trim();
    if (!body) { cmtError.textContent = "メッセージをかいてね"; return; }
    const nickname = cmtName.value.trim();
    if (nickname) localStorage.setItem("albumName", nickname);
    const sendBtn = document.getElementById("cmtSend");
    sendBtn.disabled = true;
    cmtError.textContent = "";
    try {
      let comment;
      if (serverMode) {
        const r = await fetch(API, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ game: cmtGame, nickname, body }),
        });
        const j = await r.json();
        if (!r.ok) throw new Error(j.error || "おくれなかった…もういちど ためしてね");
        comment = j.comment;
      } else {
        comment = {
          id: "local_" + Date.now(),
          nickname: nickname || "だれかさん",
          body,
          created_at: new Date().toISOString().slice(0, 19).replace("T", " "),
        };
      }
      entryOf(cmtGame).comments.push(comment);
      if (!serverMode) localSave();
      cmtBody.value = "";
      renderComments();
      refreshCounts();
    } catch (err) {
      cmtError.textContent = err.message || "おくれなかった…もういちど ためしてね";
    } finally {
      sendBtn.disabled = false;
    }
  });

  /* ---------- Escで閉じる（手前のものから） ---------- */
  document.addEventListener("keydown", e => {
    if (e.key !== "Escape") return;
    if (lightbox.classList.contains("open")) closeLightbox();
    else if (cmtModal.classList.contains("open")) closeComments();
    else if (player.classList.contains("open")) closePlayer();
  });

  /* ---------- 初期化（全定義のあとで実行） ---------- */
  renderChips();
  renderTimeline();
  loadAlbum();
})();
</script>
</body>
</html>
